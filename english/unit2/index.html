<html lang="en">
<head>

  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px;
    }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 16px; }

    header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px;
    }
    .brand h1 { font-size: 19px; font-weight: 700; }
    .brand p { font-size: 13px; color: var(--text-muted); }

    .stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat-pill {
      background: rgba(0,0,0,0.25); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; font-size: 13px; display: flex; gap: 6px;
    }
    .stat-val { font-weight: 700; color: var(--accent); }

    .controls-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px;
    }
    .control-group { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    select {
      background: #0f172a; color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    select:focus { border-color: var(--accent); outline: none; }
    select:disabled { opacity: 0.4; cursor: not-allowed; }

    .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .tab-btn {
      background: var(--surface); color: var(--text-muted); border: 1px solid var(--border);
      padding: 12px 6px; border-radius: 8px; font-weight: 600; font-size: 13px;
      cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .tab-btn:hover { background: var(--surface-hover); color: var(--text); }
    .tab-btn.active { background: #0369a1; border-color: var(--accent); color: #fff; }

    .workspace {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 28px; min-height: 480px; display: flex; flex-direction: column; justify-content: space-between;
    }

    .prompt-box { text-align: center; margin-bottom: 24px; }
    .prompt-label {
      text-transform: uppercase; font-size: 11px; letter-spacing: 1.2px;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .prompt-content {
      font-size: 26px; font-weight: 700; color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    }

    .audio-btn {
      background: none; border: none; color: var(--accent); cursor: pointer;
      font-size: 20px; line-height: 1; display: inline-flex; align-items: center;
    }
    .audio-btn:hover { transform: scale(1.15); }

    .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .opt-btn {
      background: #0f172a; border: 1px solid var(--border); color: var(--text);
      padding: 16px; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; text-align: left; transition: border 0.15s, background 0.15s;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--surface-hover); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); color: #86efac; }
    .opt-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: #fca5a5; }

    .typing-box { display: flex; gap: 10px; margin-bottom: 24px; justify-content: center; }
    .typing-input {
      background: #0f172a; border: 2px solid var(--border); color: #fff;
      font-size: 18px; font-weight: 600; padding: 12px 18px; border-radius: 8px;
      width: 100%; max-width: 440px;
    }
    .typing-input:focus { border-color: var(--accent); outline: none; }
    .typing-input.correct { border-color: var(--success); color: #86efac; }
    .typing-input.incorrect { border-color: var(--danger); color: #fca5a5; }

    .comp-builder { display: flex; flex-direction: column; gap: 16px; max-width: 600px; margin: 0 auto 20px; }
    .comp-step { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .comp-step-title { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .comp-choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice-pill {
      background: var(--surface); border: 1px solid var(--border); color: #fff;
      padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .choice-pill:hover:not(:disabled) { border-color: var(--accent); }
    .choice-pill:disabled { cursor: default; }
    .choice-pill.selected { background: var(--accent); color: #0b1120; border-color: var(--accent); }
    .choice-pill.right { background: rgba(34, 197, 94, 0.25); border-color: var(--success); color: #86efac; }
    .choice-pill.wrong { background: rgba(239, 68, 68, 0.25); border-color: var(--danger); color: #fca5a5; }

    .comp-topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; }
    .stage-badge {
      font-size: 13px; font-weight: 700; color: var(--accent);
      background: rgba(0,0,0,0.25); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px;
    }
    .rule-btn {
      background: transparent; color: var(--accent); border: 1px solid var(--accent);
      padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .rule-btn:hover { background: rgba(56, 189, 248, 0.15); }
    .rule-card { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 22px; max-width: 600px; margin: 0 auto; }
    .rule-card h2 { font-size: 20px; margin-bottom: 10px; }
    .rule-intro { color: var(--text-muted); font-size: 14px; margin-bottom: 10px; }
    .rule-list { padding-left: 22px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.4; }
    .rule-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .rule-overlay .rule-card { width: 100%; }
    .rule-note { margin-top: 10px; font-size: 14px; color: #fca5a5; line-height: 1.4; }
    .rule-why { font-weight: 400; }
    .comp-builder [hidden] { display: none; }

    .feedback-banner {
      min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600;
      background: rgba(0,0,0,0.25); border: 1px solid var(--border);
    }
    .feedback-banner.success { background: rgba(34, 197, 94, 0.15); border-color: var(--success); color: #86efac; }
    .feedback-banner.error { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: #fca5a5; }

    .action-btn {
      background: var(--accent); color: #0b1120; border: none;
      padding: 10px 20px; font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer;
    }
    .action-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .report-wrap { width: 100%; overflow-x: auto; margin: 16px 0; }
    .report-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
    .report-table th, .report-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .report-table th { background: #0f172a; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }

    @media (max-width: 600px) {
      .grid-options { grid-template-columns: 1fr; }
      .nav-tabs { grid-template-columns: 1fr 1fr; }
      .workspace { padding: 18px; }
      .prompt-content { font-size: 22px; }
    }
  </style>
</head>

let currentMode = 'vocab';
let stats = { correct: 0, total: 0, streak: 0 };
let activeQueue = [];
let retryQueue = [];
let currentItem = null;
let currentAnswer = '';
let missedLog = [];

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function unique(arr) { return [...new Set(arr)]; }

function speakUK(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = String(text).replace(/\(.*?\)/g, '').replace(/➔.*/, '').trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-GB';
  u.rate = 0.88;
  window.speechSynthesis.speak(u);
}

function speakBtn(text) {
  return `<button class="audio-btn" data-say="${esc(text)}" onclick="speakUK(this.dataset.say)" aria-label="Listen">🔊</button>`;
}

function refreshStats() {
  document.getElementById('queueCount').innerText = activeQueue.length + retryQueue.length;
  document.getElementById('streakVal').innerText = stats.streak;
  const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 100;
  document.getElementById('accuracyVal').innerText = acc + '%';
}

function record(isCorrect) {
  stats.total++;
  if (isCorrect) { stats.correct++; stats.streak++; } else { stats.streak = 0; }
  refreshStats();
}

function showResult(bannerId, ok, html) {
  const banner = document.getElementById(bannerId);
  banner.className = 'feedback-banner ' + (ok ? 'success' : 'error');
  banner.innerHTML = `<span>${html}</span> <button class="action-btn" id="nextBtn" onclick="runNextCard()">Next ➔</button>`;
  document.getElementById('nextBtn').focus();
}

function switchMode(mode) {
  currentMode = mode;
  const order = ['vocab', 'comparisons', 'grammar', 'collocations'];
  document.querySelectorAll('.nav-tabs .tab-btn').forEach((b, idx) => {
    b.classList.toggle('active', order[idx] === mode);
  });
  const vocabOnly = mode !== 'vocab';
  ['setFilter', 'dirSelect', 'inputModeSelect'].forEach(id => {
    document.getElementById(id).disabled = vocabOnly;
  });
  initSession();
}

function initSession(practiceOnlyMissed) {
  practiceOnlyMissed = practiceOnlyMissed === true;
  trackSessionStart(practiceOnlyMissed);
  stats = { correct: 0, total: 0, streak: 0 };

  if (practiceOnlyMissed) {
    activeQueue = shuffle(missedLog.map(m => m.rawItem));
    compStage = null;
  } else {
    const scope = document.getElementById('setFilter').value;
    if (currentMode === 'vocab') {
      const pool = scope === 'ALL' ? FULL_DATABASE : FULL_DATABASE.filter(i => i.cat === scope);
      activeQueue = shuffle(pool);
    } else if (currentMode === 'comparisons') {
      compStage = 0;
      activeQueue = shuffle(compStageItems(compStage));
    } else if (currentMode === 'grammar') {
      activeQueue = shuffle([...ADVERB_DATA, ...PRONOUN_DATA]);
    } else {
      activeQueue = shuffle(COLLOCATIONS_DATA);
    }
  }
  retryQueue = [];
  missedLog = [];
  refreshStats();
  if (currentMode === 'comparisons') renderCompRuleScreen();
  else runNextCard();
}

function runNextCard() {
  if (activeQueue.length === 0) {
    if (retryQueue.length > 0) {
      activeQueue = shuffle(retryQueue);
      retryQueue = [];
    } else {
      if (currentMode === 'comparisons' && compStage !== null && compStage < COMP_STAGES.length - 1) {
        renderCompStageDone();
        return;
      }
      renderCompletionScreen();
      return;
    }
  }
  currentItem = activeQueue.shift();
  refreshStats();

  if (currentMode === 'vocab') renderVocabCard();
  else if (currentMode === 'comparisons') renderComparisonCard();
  else if (currentMode === 'grammar') renderGrammarCard();
  else renderCollocationCard();
}

function logMistake(key, answer, raw) {
  const existing = missedLog.find(m => m.key === key);
  if (existing) existing.attempts++;
  else missedLog.push({ key, answer, rawItem: raw, attempts: 1 });
}

/* ==========================================================================
   RESULT TRACKING (silent; never affects the trainer if sending fails)
   ========================================================================== */
const TAB_NAMES = {
  vocab: '1. Core Vocab',
  comparisons: '2. Comparison Traps',
  grammar: '3. Adverbs & Mine/Yours',
  collocations: '4. Collocations'
};
let session = null;

function selectedText(id) {
  const el = document.getElementById(id);
  return el && el.selectedIndex >= 0 ? el.options[el.selectedIndex].text : '';
}

function sendResult(data, useBeacon) {
  try {
    if (!SHEET_URL) return;
    const body = JSON.stringify(data);
    if (useBeacon && navigator.sendBeacon) {
      navigator.sendBeacon(SHEET_URL, new Blob([body], { type: 'text/plain;charset=UTF-8' }));
      return;
    }
    fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: body,
      keepalive: true
    }).catch(function () {});
  } catch (e) { /* tracking must never break the trainer */ }
}

function trackSessionStart(practiceOnlyMissed) {
  try {
    trackSessionEnd('interrupted', false);
    const vocab = currentMode === 'vocab';
    session = {
      start: Date.now(),
      tab: TAB_NAMES[currentMode] || currentMode,
      scope: vocab ? selectedText('setFilter') + (practiceOnlyMissed ? ' [missed only]' : '') : '-',
      direction: vocab ? selectedText('dirSelect') : '-',
      input: vocab ? selectedText('inputModeSelect') : '-',
      sent: false
    };
  } catch (e) { session = null; }
}

function trackAnswer(question, given, correct, ok) {
  try {
    if (!session) return;
    sendResult({
      kind: 'answer',
      ts: new Date().toISOString(),
      student: STUDENT,
      tab: session.tab,
      settings: [session.scope, session.direction, session.input].join(' | '),
      question: String(question),
      given: String(given),
      correct: String(correct),
      ok: !!ok
    }, false);
  } catch (e) {}
}

function trackSessionEnd(status, useBeacon) {
  try {
    if (!session || session.sent || stats.total === 0) return;
    session.sent = true;
    sendResult({
      kind: 'session',
      ts: new Date(session.start).toISOString(),
      student: STUDENT,
      tab: session.tab,
      scope: session.scope,
      direction: session.direction,
      input: session.input,
      duration: Math.round((Date.now() - session.start) / 1000),
      cards: stats.total,
      accuracy: Math.round((stats.correct / stats.total) * 100),
      mistakes: missedLog.map(m => ({ q: m.key, a: m.answer, n: m.attempts })),
      status: status
    }, useBeacon);
  } catch (e) {}
}

window.addEventListener('pagehide', function () { trackSessionEnd('interrupted', true); });

/* ==========================================================================
   MODE 1: CORE VOCABULARY
   ========================================================================== */
function normalize(s) {
  return String(s).toLowerCase()
    .replace(/\(.*?\)/g, '')
    .replace(/[.!?]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function stripLead(s) {
  return s.replace(/^to /, '').replace(/^(der|die|das) /, '');
}

// Accepts: either variant of "A, B", with or without the bracketed part,
// with or without "to" before verbs and der/die/das before nouns, final punctuation optional.
function isTypedCorrect(input, answer) {
  const accepted = new Set();
  const parts = [answer, ...answer.split(',')];
  parts.forEach(p => {
    const n = normalize(p);
    if (!n) return;
    accepted.add(n);
    accepted.add(stripLead(n));
  });
  const u = normalize(input);
  if (!u) return false;
  return accepted.has(u) || accepted.has(stripLead(u));
}

function renderVocabCard() {
  const dir = document.getElementById('dirSelect').value;
  const inputMode = document.getElementById('inputModeSelect').value;
  const promptText = dir === 'DE_EN' ? currentItem.de : currentItem.en;
  currentAnswer = dir === 'DE_EN' ? currentItem.en : currentItem.de;
  const ws = document.getElementById('appWorkspace');

  let interactionHTML = '';
  if (inputMode === 'type') {
    interactionHTML = `
      <div class="typing-box">
        <input type="text" class="typing-input" id="typeInput" placeholder="Type answer..." autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="action-btn" id="submitBtn" onclick="checkVocabTyped()">Submit</button>
      </div>`;
  } else {
    const sameCat = FULL_DATABASE.filter(x => x.en !== currentItem.en && x.cat === currentItem.cat);
    const otherCat = FULL_DATABASE.filter(x => x.en !== currentItem.en && x.cat !== currentItem.cat);
    const distractors = sameCat.length >= 3 ? shuffle(sameCat).slice(0, 3) : shuffle([...sameCat, ...otherCat]).slice(0, 3);
    const options = shuffle(unique([currentItem, ...distractors].map(x => dir === 'DE_EN' ? x.en : x.de)));
    interactionHTML = `
      <div class="grid-options" id="vocabGrid">
        ${options.map(opt => `<button class="opt-btn" data-val="${esc(opt)}" onclick="checkVocabChoice(this)">${esc(opt)}</button>`).join('')}
      </div>`;
  }

  ws.innerHTML = `
    <div>
      <div class="prompt-box">
        <div class="prompt-label">Translate (${dir === 'DE_EN' ? 'DE ➔ EN' : 'EN ➔ DE'})</div>
        <div class="prompt-content">
          ${esc(promptText)}
          ${dir === 'EN_DE' ? speakBtn(currentItem.en) : ''}
        </div>
      </div>
      ${interactionHTML}
    </div>
    <div class="feedback-banner" id="fbBanner">
      <span>${inputMode === 'type' ? 'Type the translation and press Enter' : 'Choose the correct match'}</span>
    </div>`;

  if (inputMode === 'type') {
    const inp = document.getElementById('typeInput');
    inp.focus();
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        if (!inp.disabled) checkVocabTyped();
      }
    });
  }
}

function checkVocabChoice(btn) {
  const isCorrect = btn.dataset.val === currentAnswer;
  const grid = document.getElementById('vocabGrid');
  grid.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (!isCorrect && b.dataset.val === currentAnswer) b.classList.add('correct');
  });
  btn.classList.add(isCorrect ? 'correct' : 'incorrect');
  handleVocabOutcome(isCorrect, '', btn.dataset.val);
}

function checkVocabTyped() {
  const inp = document.getElementById('typeInput');
  if (!inp.value.trim()) { inp.focus(); return; }
  const isCorrect = isTypedCorrect(inp.value, currentAnswer);
  inp.disabled = true;
  document.getElementById('submitBtn').disabled = true;
  inp.classList.add(isCorrect ? 'correct' : 'incorrect');
  handleVocabOutcome(isCorrect, inp.value.trim(), inp.value.trim());
}

function handleVocabOutcome(isCorrect, typed, given) {
  speakUK(currentItem.en);
  trackAnswer(document.getElementById('dirSelect').value === 'DE_EN' ? currentItem.de : currentItem.en, given, currentAnswer, isCorrect);
  if (isCorrect) {
    const note = typed && normalize(typed) !== normalize(currentAnswer) ? ` Full form: <strong>${esc(currentAnswer)}</strong>` : '';
    record(true);
    showResult('fbBanner', true, 'Correct!' + note);
  } else {
    logMistake(currentItem.en, currentItem.de, currentItem);
    retryQueue.push(currentItem);
    record(false);
    showResult('fbBanner', false, `Correct: <strong>${esc(currentAnswer)}</strong>`);
  }
}

  'Endung -e → nur -r / -st: larger, the largest',
  'kurzes Wort, Vokal + Konsonant am Ende → Buchstaben verdoppeln: bigger, the hottest',
  'alles andere → -er / -est'
];

/* Stages: null = all words mixed */
const COMP_STAGES = [
  ['tall', 'long', 'cold', 'cool', 'small', 'big', 'hot', 'large'],
  ['happy', 'funny', 'crazy', 'dirty', 'easy', 'cheeky', 'good', 'bad'],
  ['beautiful', 'interesting', 'dangerous', 'exciting', 'expensive', 'colourful', 'comfortable', 'attractive'],
  null
];

let compStage = 0;            // index in COMP_STAGES; null = "missed words" practice
let compRuleChoice = null;
let compAnswerState = { comp: null, sup: null };

function compStageItems(i) {
  const names = COMP_STAGES[i];
  return names ? COMPARISON_TRAPS.filter(it => names.includes(it.base)) : [...COMPARISON_TRAPS];
}

function compWordRule() {
  return COMP_WORD_RULES[currentItem.base] || ['er', ''];
}

function compRule(key) {
  return COMP_RULES.find(r => r.key === key) || { key: key, label: key, short: key };
}

function compAlgorithmHTML() {
  return `
    <p class="rule-intro">Der Reihe nach prüfen – beim ersten „Ja“ stoppen:</p>
    <ol class="rule-list">${COMP_ALGORITHM.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
}

function compTopBar() {
  const label = compStage === null ? 'Missed words' : `Stage ${compStage + 1} of ${COMP_STAGES.length}`;
  return `
    <div class="comp-topbar">
      <span class="stage-badge">${label}</span>
      <button class="rule-btn" onclick="openCompRule()">Rule</button>
    </div>`;
}

function renderCompRuleScreen() {
  document.getElementById('appWorkspace').innerHTML = `
    <div>
      ${compTopBar()}
      <div class="rule-card">
        <h2>Rule</h2>
        ${compAlgorithmHTML()}
        <button class="action-btn" id="compStartBtn" onclick="runNextCard()">Start</button>
      </div>
    </div>`;
  document.getElementById('compStartBtn').focus();
}

function openCompRule() {
  closeCompRule();
  const ov = document.createElement('div');
  ov.id = 'compRuleOverlay';
  ov.className = 'rule-overlay';
  ov.innerHTML = `
    <div class="rule-card" role="dialog" aria-modal="true">
      <h2>Rule</h2>
      ${compAlgorithmHTML()}
      <button class="action-btn" id="compRuleClose" onclick="closeCompRule()">Close</button>
    </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeCompRule(); });
  ov.addEventListener('keydown', e => { if (e.key === 'Escape') closeCompRule(); });
  document.body.appendChild(ov);
  document.getElementById('compRuleClose').focus();
}

function closeCompRule() {
  const ov = document.getElementById('compRuleOverlay');
  if (ov) ov.remove();
}

function renderCompStageDone() {
  const next = compStage + 2;
  const isLast = next === COMP_STAGES.length;
  document.getElementById('appWorkspace').innerHTML = `
    <div>
      ${compTopBar()}
      <div class="rule-card" style="text-align: center;">
        <h2>Stage ${compStage + 1} complete!</h2>
        <p class="rule-intro">Next: Stage ${next} of ${COMP_STAGES.length}${isLast ? ' – all words, mixed' : ''}</p>
        <button class="action-btn" id="compNextStageBtn" onclick="startNextCompStage()">Next stage ➔</button>
      </div>
    </div>`;
  document.getElementById('compNextStageBtn').focus();
}

function startNextCompStage() {
  compStage++;
  activeQueue = shuffle(compStageItems(compStage));
  retryQueue = [];
  refreshStats();
  runNextCard();
}

function renderComparisonCard() {
  compAnswerState = { comp: null, sup: null };
  compRuleChoice = null;
  const compOptions = shuffle([currentItem.comp, ...currentItem.compTraps]);
  const supOptions = shuffle([currentItem.sup, ...currentItem.supTraps]);
  const pill = (type, opt) => `<button class="choice-pill" data-val="${esc(opt)}" onclick="selectCompForm('${type}', this)">${esc(opt)}</button>`;
  const rulePill = r => `<button class="choice-pill" data-val="${esc(r.key)}" onclick="selectCompRule(this)">${esc(r.label)}</button>`;

  document.getElementById('appWorkspace').innerHTML = `
    <div>
      ${compTopBar()}
      <div class="prompt-box">
        <div class="prompt-label">Adjective Comparison</div>
        <div class="prompt-content">${esc(currentItem.base)} ${speakBtn(currentItem.base)}</div>
      </div>
      <div class="comp-builder">
        <div class="comp-step">
          <div class="comp-step-title">1. Rule</div>
          <div class="comp-choices" id="ruleChoices">${COMP_RULES.map(rulePill).join('')}</div>
          <div class="rule-note" id="ruleNote" hidden></div>
        </div>
        <div class="comp-step" id="compFormStep" hidden>
          <div class="comp-step-title">2. Comparative</div>
          <div class="comp-choices" id="compChoices">${compOptions.map(o => pill('comp', o)).join('')}</div>
        </div>
        <div class="comp-step" id="supFormStep" hidden>
          <div class="comp-step-title">3. Superlative</div>
          <div class="comp-choices" id="supChoices">${supOptions.map(o => pill('sup', o)).join('')}</div>
        </div>
      </div>
    </div>
    <div class="feedback-banner" id="compBanner">
      <span id="compHint">Choose the rule first</span>
      <button class="action-btn" id="verifyCompBtn" onclick="verifyComparisons()" disabled>Check</button>
    </div>`;
}

function selectCompRule(btn) {
  if (compRuleChoice) return;
  compRuleChoice = btn.dataset.val;
  const [rightKey, why] = compWordRule();
  markPills('ruleChoices', rightKey, compRuleChoice);
  if (compRuleChoice !== rightKey) {
    const note = document.getElementById('ruleNote');
    note.innerHTML = `Richtig: <strong>${esc(compRule(rightKey).label)}</strong><br><span class="rule-why">${esc(why)}</span>`;
    note.hidden = false;
  }
  document.getElementById('compFormStep').hidden = false;
  document.getElementById('supFormStep').hidden = false;
  document.getElementById('compHint').innerText = 'Select both forms, then click Check';
}

function selectCompForm(type, btn) {
  compAnswerState[type] = btn.dataset.val;
  const container = document.getElementById(type === 'comp' ? 'compChoices' : 'supChoices');
  container.querySelectorAll('.choice-pill').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  if (compRuleChoice && compAnswerState.comp && compAnswerState.sup) {
    const v = document.getElementById('verifyCompBtn');
    v.disabled = false;
    v.focus();
  }
}

function markPills(containerId, correct, chosen) {
  document.getElementById(containerId).querySelectorAll('.choice-pill').forEach(b => {
    b.disabled = true;
    b.classList.remove('selected');
    if (b.dataset.val === correct) b.classList.add('right');
    else if (b.dataset.val === chosen) b.classList.add('wrong');
  });
}

function verifyComparisons() {
  if (!compRuleChoice || !compAnswerState.comp || !compAnswerState.sup) return;
  const [rightKey, why] = compWordRule();
  const okRule = compRuleChoice === rightKey;
  const okComp = compAnswerState.comp === currentItem.comp;
  const okSup = compAnswerState.sup === currentItem.sup;
  markPills('compChoices', currentItem.comp, compAnswerState.comp);
  markPills('supChoices', currentItem.sup, compAnswerState.sup);
  speakUK(`${currentItem.base}, ${currentItem.comp}, ${currentItem.sup}`);
  trackAnswer(currentItem.base, `Regel: ${compRule(compRuleChoice).short} | ${compAnswerState.comp} / ${compAnswerState.sup}`, `${currentItem.comp} / ${currentItem.sup}`, okRule && okComp && okSup);

  if (okRule && okComp && okSup) {
    record(true);
    showResult('compBanner', true, 'All correct!');
  } else {
    logMistake(currentItem.base, `${currentItem.comp} | ${currentItem.sup}`, currentItem);
    retryQueue.push(currentItem);
    record(false);
    if (okComp && okSup) {
      showResult('compBanner', false, 'Forms correct, but the rule was wrong.');
    } else {
      showResult('compBanner', false, `Correct: <strong>${esc(currentItem.comp)}</strong> / <strong>${esc(currentItem.sup)}</strong><br><span class="rule-why">${esc(why)}</span>`);
    }
  }
}

/* ==========================================================================
   MODE 3: ADVERBS & MINE/YOURS
   ========================================================================== */
function renderGrammarCard() {
  const isAdverb = !!currentItem.adj;
  const label = isAdverb ? 'Adjective ➔ Adverb' : 'Possessive Pronoun';
  const title = isAdverb ? currentItem.adj : currentItem.phrase;
  const sub = isAdverb ? 'How does an action happen?' : currentItem.de;
  currentAnswer = isAdverb ? currentItem.adv : currentItem.target;
  const options = shuffle(unique([currentAnswer, ...currentItem.traps]));

  document.getElementById('appWorkspace').innerHTML = `
    <div>
      <div class="prompt-box">
        <div class="prompt-label">${label}</div>
        <div class="prompt-content">${esc(title)} ${speakBtn(title)}</div>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;">${esc(sub)}</p>
      </div>
      <div class="grid-options" id="gramGrid">
        ${options.map(opt => `<button class="opt-btn" data-val="${esc(opt)}" onclick="checkGrammarChoice(this)">${esc(opt)}</button>`).join('')}
      </div>
    </div>
    <div class="feedback-banner" id="gramBanner"><span>Choose the correct form</span></div>`;
}

function checkGrammarChoice(btn) {
  const isCorrect = btn.dataset.val === currentAnswer;
  document.getElementById('gramGrid').querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (!isCorrect && b.dataset.val === currentAnswer) b.classList.add('correct');
  });
  btn.classList.add(isCorrect ? 'correct' : 'incorrect');
  speakUK(currentAnswer);
  trackAnswer(currentItem.adj || currentItem.phrase, btn.dataset.val, currentAnswer, isCorrect);

  if (isCorrect) {
    record(true);
    showResult('gramBanner', true, 'Correct!');
  } else {
    logMistake(currentItem.adj || currentItem.phrase, currentAnswer, currentItem);
    retryQueue.push(currentItem);
    record(false);
    showResult('gramBanner', false, `Correct: <strong>${esc(currentAnswer)}</strong>`);
  }
}

/* ==========================================================================
   MODE 4: SENTENCE COMPLETION
   ========================================================================== */
function renderCollocationCard() {
  currentAnswer = currentItem.target;
  const options = shuffle([currentItem.target, ...currentItem.traps]);

  document.getElementById('appWorkspace').innerHTML = `
    <div>
      <div class="prompt-box">
        <div class="prompt-label">Complete the Sentence</div>
        <div class="prompt-content">${esc(currentItem.stem)} ...</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin: 0 auto 20px;" id="collocGrid">
        ${options.map(opt => `<button class="opt-btn" data-val="${esc(opt)}" onclick="checkCollocChoice(this)">... ${esc(opt)}</button>`).join('')}
      </div>
    </div>
    <div class="feedback-banner" id="collocBanner"><span>Choose the best ending</span></div>`;
}

function checkCollocChoice(btn) {
  const isCorrect = btn.dataset.val === currentAnswer;
  document.getElementById('collocGrid').querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (!isCorrect && b.dataset.val === currentAnswer) b.classList.add('correct');
  });
  btn.classList.add(isCorrect ? 'correct' : 'incorrect');
  speakUK(currentItem.stem + ' ' + currentAnswer);
  trackAnswer(currentItem.stem, btn.dataset.val, currentAnswer, isCorrect);

  if (isCorrect) {
    record(true);
    showResult('collocBanner', true, 'Correct!');
  } else {
    logMistake(currentItem.stem, currentAnswer, currentItem);
    retryQueue.push(currentItem);
    record(false);
    showResult('collocBanner', false, `Answer: <strong>${esc(currentAnswer)}</strong>`);
  }
}

/* ==========================================================================
   COMPLETION SCREEN
   ========================================================================== */
function renderCompletionScreen() {
  trackSessionEnd('completed', false);
  const ws = document.getElementById('appWorkspace');
  let reportHTML = '';
  if (missedLog.length === 0) {
    reportHTML = `<p style="color: var(--success); font-weight: 600; margin: 16px 0;">No mistakes in this session!</p>`;
  } else {
    reportHTML = `
      <div style="margin: 18px 0; text-align: left;">
        <h3 style="font-size: 15px; margin-bottom: 8px; color: var(--warning);">Words to review:</h3>
        <div class="report-wrap">
          <table class="report-table">
            <thead><tr><th>Prompt</th><th>Answer</th><th>Mistakes</th></tr></thead>
            <tbody>
              ${missedLog.map(m => `
                <tr>
                  <td style="font-weight: 600;">${esc(m.key)}</td>
                  <td style="color: var(--accent);">${esc(m.answer)}</td>
                  <td style="color: var(--danger); font-weight: 700;">${m.attempts}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  ws.innerHTML = `
    <div style="text-align: center; margin: auto; max-width: 640px; width: 100%;">
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">Session Finished</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Accuracy: <strong>${document.getElementById('accuracyVal').innerText}</strong></p>
      ${reportHTML}
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px;">
        <button class="action-btn" id="restartBtn" onclick="initSession(false)">Restart Full Session</button>
        ${missedLog.length > 0 ? `<button class="action-btn" style="background: var(--warning);" onclick="initSession(true)">Practise Only ${missedLog.length} Missed Items</button>` : ''}
      </div>
    </div>`;
  document.getElementById('restartBtn').focus();
}

initSession();
</script>
</body>
</html>
