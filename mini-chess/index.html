<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f0b">
<meta name="description" content="Перші шахи для дітей 4–7 років: маленька дошка 5×5, сім рівнів від пішаків до справжньої партії.">
<title>Міні-шахи</title>
<link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
<link rel="apple-touch-icon" href="../shared/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Міні-шахи · Yaroslav Chess">
<meta property="og:description" content="Перші шахи для малят, рівень за рівнем">
<meta property="og:image" content="https://yaroslavchess.github.io/Chess-games/shared/og.png">
<meta property="og:url" content="https://yaroslavchess.github.io/Chess-games/mini-chess/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #120f0b;
  --bg-glow: #1c1712;
  --panel: #1c1712;
  --panel-2: #241d15;
  --hairline: #3a3025;
  --board-light: #ead9ba;
  --board-dark: #86644a;
  --board-dark-hi: #977252;
  --frame: #0c0a08;
  --text: #f1e9d8;
  --text-dim: #b7a98e;
  --text-faint: #7d7361;
  --gold: #d8a94c;
  --gold-soft: #f0cf8f;
  --green: #2ecc71;
  --green-soft: #a8e0bb;
  --blue: #5b8fd8;
  --blocked-a: #443c30;
  --blocked-b: #37312a;
  --danger: #c96a4d;
  --ink: #120f0b;
  --on-gold: #241a08;
  --gold-deep: #a9782c;
  --frame-hi: #241b10;
  --panel-hi: #2a2013;
  --panel-hi-2: #3a2e1a;
  --done-a: #3a4f3c;
  --done-b: #2a3a2c;
  --done-line: #4a6a4e;
  --arrow-safe: #3b2f20;
  --piece-w: #fbf5e6;
  --piece-w-line: #241a0e;
  --piece-b: #1b140d;
  --piece-b-line: #e9dcc0;
  --piece-w-a: #f1e9d8;
  --piece-w-b: #f0cf8f;
  --piece-b-a: #3a3025;
  --piece-b-b: #120f0b;
  --gold-rgb: 216, 169, 76;
  --gold-dark-rgb: 160, 110, 30;
  --green-rgb: 46, 204, 113;
  --green-soft-rgb: 168, 224, 187;
  --target-rgb: 87, 180, 122;
  --danger-rgb: 201, 106, 77;
  --overlay-rgb: 10, 8, 5;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-deep: 0 24px 60px -24px rgba(0,0,0,.75);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background: radial-gradient(120% 90% at 50% -10%, var(--bg-glow) 0%, var(--bg) 55%);
  color: var(--text);
  font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  line-height: 1.4;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.hidden { display: none !important; }
svg { display: block; }

/* ---------- Верхня панель ---------- */
.topbar {
  background: var(--panel);
  border-bottom: 1px solid var(--hairline);
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  padding-top: max(8px, env(safe-area-inset-top));
}
.topbar h1 {
  flex: 1; margin: 0;
  font-family: 'Fraunces', Georgia, serif; font-weight: 600;
  font-size: 22px; color: var(--gold-soft);
}
.icon-btn {
  width: 48px; height: 48px;
  border: 1px solid var(--hairline); border-radius: var(--radius-md);
  background: var(--panel-2);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex: none;
}
.icon-btn svg { width: 28px; height: 28px; }
.icon-btn:hover, .icon-btn:focus-visible { border-color: var(--gold); }
.icon-btn.gold { color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }

.wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 26px; margin: 4px 0 12px; line-height: 1.2; color: var(--gold-soft); }
p { margin: 0 0 12px; }
.lead { color: var(--text-dim); font-size: 16px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%;
  min-height: 60px;
  padding: 12px 18px;
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  font-family: 'Manrope', sans-serif;
  font-size: 20px; font-weight: 800;
  cursor: pointer;
  text-decoration: none;
}
.btn svg { width: 30px; height: 30px; flex: none; }
.btn-primary { background: linear-gradient(160deg, var(--gold), var(--gold-deep)); color: var(--on-gold); border-color: transparent; }
.btn-primary:hover, .btn-primary:focus-visible { background: var(--gold); }
.btn-secondary { background: var(--panel-2); color: var(--text); }
.btn-secondary:hover, .btn-secondary:focus-visible { border-color: var(--gold); }
.btn + .btn { margin-top: 12px; }
.btn:active { transform: translateY(2px); }

/* ---------- Карта рівнів ---------- */
.levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 8px 0 20px; }
.tile {
  position: relative;
  border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  background: var(--panel);
  padding: 10px 8px 8px;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center;
  min-height: 150px;
}
.tile:last-child { grid-column: 1 / -1; }
.tile .num {
  position: absolute; left: 10px; top: 8px;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--panel-2); border: 1px solid var(--hairline); color: var(--gold-soft);
  font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.tile .pic { width: 84px; height: 84px; display: flex; justify-content: center; }
.tile .pic svg { width: 84px; height: 84px; }
.tile .pic svg + svg { margin-left: -34px; }
.tile .name { font-weight: 800; font-size: 17px; }
.tile .stars { display: flex; align-items: center; gap: 2px; margin-top: 2px; }
.tile .stars svg { width: 24px; height: 24px; }
.tile .stars svg.medal-svg { width: 26px; height: 26px; margin-left: 6px; }
.tile.locked { background: repeating-linear-gradient(135deg, var(--blocked-a) 0 7px, var(--blocked-b) 7px 14px); color: var(--text-dim); }
.tile.locked .pic, .tile.locked .name, .tile.locked .stars { opacity: 0.35; }
.tile .lock { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; }
.tile .lock svg { width: 54px; height: 54px; }
.tile.next { border-color: var(--gold-soft); box-shadow: 0 0 0 3px rgba(var(--gold-rgb),.35); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.03); } }
.shake { animation: shake 0.4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* ---------- Зірочки й медаль ---------- */
.star-on { fill: var(--gold); stroke: var(--gold-deep); }
.star-off { fill: var(--panel-2); stroke: var(--hairline); }
.medal-svg .m-ribbon { fill: var(--danger); }
.medal-svg .m-disc { fill: var(--gold); stroke: var(--gold-deep); stroke-width: 3; }
.medal-svg.off { opacity: 0.35; filter: grayscale(1); }

/* ---------- Підказка рівня ---------- */
.card { background: var(--panel); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; }
.hint-board { width: min(100%, 250px); margin: 0 auto 12px; }
.hint-text { display: flex; gap: 10px; align-items: center; font-size: 20px; font-weight: 700; margin: 0; }
.hint-text span { flex: 1; }
.goal { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--panel-2); color: var(--gold-soft); font-weight: 700; }
.goal svg { width: 28px; height: 28px; flex: none; }

.toggle { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.toggle button {
  border: 1px solid var(--hairline); background: var(--panel-2); border-radius: var(--radius-md);
  padding: 12px 14px; text-align: left; font-weight: 700; font-size: 17px; cursor: pointer;
  display: flex; gap: 10px; align-items: center;
}
.toggle button .radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--text-dim); flex: none; }
.toggle button[aria-checked="true"] { border-color: var(--gold); }
.toggle button[aria-checked="true"] .radio { background: var(--gold); box-shadow: inset 0 0 0 4px var(--panel-2); border-color: var(--gold); }

.opponents { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opp {
  border: 1px solid var(--hairline); border-radius: var(--radius-lg); background: var(--panel); cursor: pointer;
  padding: 12px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 19px; font-weight: 800;
}
.opp svg { width: 96px; height: 96px; }
.opp small { font-weight: 600; font-size: 14px; color: var(--text-dim); }
.opp:hover, .opp:focus-visible { border-color: var(--gold); }

/* ---------- Дошка ---------- */
.board {
  position: relative;
  width: 100%;
  height: 0;
  padding-bottom: 100%;
  border-radius: var(--radius-sm);
  overflow: hidden;
  box-shadow: 0 0 0 6px var(--frame), 0 10px 30px -12px rgba(0,0,0,.7);
}
.board .sq {
  position: absolute; width: 20%; height: 20%;
  border: 0; padding: 0; margin: 0;
  background: var(--board-light);
  cursor: pointer;
}
.board .sq.dark { background: var(--board-dark); }
.board .sq.finish { background-image: linear-gradient(rgba(var(--danger-rgb),.3), rgba(var(--danger-rgb),.3)); }
.board .sq.last { box-shadow: inset 0 0 0 4px var(--gold); }
.board .sq.sel { background-image: linear-gradient(rgba(var(--gold-rgb),.7), rgba(var(--gold-rgb),.7)); }
.board .sq.check { background-image: radial-gradient(circle, rgba(var(--danger-rgb),.95) 0, rgba(var(--danger-rgb),.55) 45%, rgba(var(--danger-rgb),0) 72%); }
.board .sq .dot { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; z-index: 3; pointer-events: none; }
.board .sq .dot::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 34%; height: 34%; margin: -17% 0 0 -17%;
  border-radius: 50%; background: var(--green); opacity: 0.9;
  box-shadow: 0 0 0 3px var(--frame);
}
.board .sq.mv .dot, .board .sq.cap .dot { display: block; }
.board .sq.cap .dot::after {
  width: 86%; height: 86%; margin: -43% 0 0 -43%;
  background: transparent; border: 6px solid var(--green); box-shadow: none; opacity: 0.9;
}
.board .sq.foe .dot::after { background: var(--frame); opacity: 0.35; box-shadow: none; }
.board .sq.foe.cap .dot::after { background: transparent; border-color: var(--frame); opacity: 0.4; }
.board .pieces { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 2; }
.board .pc-wrap {
  position: absolute; left: 0; top: 0; width: 20%; height: 20%;
  transition: transform 0.3s ease-in-out;
  will-change: transform;
}
.board .pieces.no-anim .pc-wrap { transition: none; }
.pc-wrap .pc-in { width: 100%; height: 100%; padding: 5%; transition: transform 0.2s; }
.pc-wrap .pc-in svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
.pc-wrap.sel .pc-in { transform: scale(1.1); }
.pc-wrap.appear .pc-in { animation: appear 0.3s ease-out; }
.pc-wrap.captured { transition: opacity 0.3s, transform 0.3s; opacity: 0; }
.pc-wrap.captured .pc-in { transform: scale(0.3) rotate(25deg); }
.pc-wrap.jump .pc-in { animation: jump 0.3s ease-in-out; }
.pc-wrap.glow .pc-in { animation: glow 1s ease-in-out; }
.pc-wrap.morph .pc-in { animation: morph 0.6s ease-in-out; }
@keyframes appear { from { transform: scale(0.2); opacity: 0; } }
@keyframes jump { 50% { transform: scale(1.35) translateY(-10%); } }
@keyframes glow {
  0% { transform: scale(1); filter: none; }
  35% { transform: scale(1.45) translateY(-12%); filter: drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 18px var(--gold-soft)); }
  70% { transform: scale(1.3) rotate(-8deg); filter: drop-shadow(0 0 14px var(--gold)); }
  100% { transform: scale(1); filter: none; }
}
@keyframes morph { 0% { transform: scale(1) rotateY(0); } 50% { transform: scale(1.3) rotateY(90deg); } 100% { transform: scale(1) rotateY(0); } }

/* Фігури: обведення товще за тіло, тож деталі зливаються в один силует. */
.pc .o { stroke-width: 7; stroke-linejoin: round; }
.pc .d { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.pc .e { stroke: none; }
.pc-w .o { fill: var(--frame); stroke: var(--frame); }
.pc-w .f { fill: url(#grad-w); }
.pc-w .d { stroke: var(--frame); }
.pc-w .e { fill: var(--frame); }
.pc-b .o { fill: var(--frame); stroke: var(--frame); }
.pc-b .f { fill: url(#grad-b); }
.pc-b .d { stroke: var(--gold-soft); }
.pc-b .e { fill: var(--gold-soft); }

/* ---------- Екран гри ---------- */
.status {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  padding: 6px 12px 6px 6px; margin-bottom: 10px;
  min-height: 60px; font-size: 18px; font-weight: 800;
}
.status .ava { width: 48px; height: 48px; flex: none; }
.status .ava svg { width: 48px; height: 48px; }
.status .txt { flex: 1; }
.status.my-turn { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(var(--gold-rgb),.18); color: var(--gold-soft); }
.status .thinking { display: inline-flex; gap: 4px; margin-left: 6px; }
.status .thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); animation: blink 1s infinite; }
.status .thinking i:nth-child(2) { animation-delay: 0.2s; }
.status .thinking i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 50% { opacity: 0.2; } }
.goal-line { font-size: 14px; color: var(--text-dim); font-weight: 700; margin: 0 0 8px; text-align: center; }
.tray {
  display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  min-height: 40px; padding: 4px 8px; margin: 8px 0;
  font-size: 14px; font-weight: 700; color: var(--text-dim);
}
.tray .lbl { margin-right: 6px; }
.tray svg { width: 32px; height: 32px; }
.board-box { padding: 6px; }
#boardTools { margin-top: 6px; }
.room {
  background: var(--panel-2); border: 1px solid var(--hairline); border-radius: var(--radius-md);
  padding: 10px 14px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700;
}
.room b { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.1em; color: var(--gold-soft); }
.room .net { font-size: 14px; font-weight: 600; color: var(--text-dim); text-align: right; }
.link-box { background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; }
.link-box p { margin: 0 0 8px; font-weight: 700; }
.link-row { display: flex; gap: 8px; }
.link-row input {
  flex: 1; min-width: 0; min-height: 48px;
  border: 1px solid var(--hairline); border-radius: var(--radius-sm);
  background: var(--frame); color: var(--text); padding: 0 10px;
  font-family: 'JetBrains Mono', monospace; font-size: 14px;
  -webkit-user-select: text; user-select: text;
}
.link-row .btn { width: auto; min-height: 48px; font-size: 16px; padding: 8px 14px; flex: none; }
.link-done { color: var(--green-soft); font-size: 14px; font-weight: 700; margin: 8px 0 0; }
.link-done:empty { display: none; }
.game-actions { display: flex; gap: 12px; margin-top: 16px; }
.game-actions .btn { margin: 0; }

/* ---------- Накладки ---------- */
.overlay {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20;
  background: rgba(var(--overlay-rgb),.72);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.dialog {
  background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius-lg);
  padding: 22px 18px 18px;
  width: 100%; max-width: 400px; text-align: center;
  box-shadow: 0 30px 70px -20px rgba(0,0,0,.8);
  animation: pop 0.35s ease-out;
  max-height: 100%; overflow-y: auto;
}
@keyframes pop { from { transform: scale(0.6); opacity: 0; } }
.dialog h2 { font-size: 30px; margin: 6px 0; }
.dialog .big svg { width: 110px; height: 110px; margin: 0 auto; }
.dialog .reason { color: var(--text-dim); font-size: 17px; font-weight: 600; }
.result-stars { display: flex; justify-content: center; gap: 8px; margin: 6px 0 8px; }
.result-stars svg { width: 48px; height: 48px; }
.result-stars .star-on { animation: starpop 0.5s ease-out both; }
.result-stars svg:nth-child(2) .star-on { animation-delay: 0.25s; }
.result-stars svg:nth-child(3) .star-on { animation-delay: 0.5s; }
@keyframes starpop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
.result-stars path { transform-origin: 12px 12px; }
.star-list { list-style: none; margin: 0 0 10px; padding: 0; text-align: left; }
.star-list li { display: flex; align-items: center; gap: 10px; padding: 3px 4px; font-size: 16px; font-weight: 700; color: var(--text-dim); }
.star-list li svg { width: 26px; height: 26px; flex: none; }
.star-list li.got { color: var(--gold-soft); }
.star-list li.note { font-size: 14px; font-weight: 600; color: var(--text-faint); padding-left: 40px; }
.medal-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 12px; font-size: 16px; font-weight: 800; color: var(--gold-soft); text-align: left; }
.medal-row svg { width: 52px; height: 52px; flex: none; animation: starpop 0.6s ease-out both; animation-delay: 0.7s; }

.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 12px 0 16px; }
.pin-dots i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--gold-soft); }
.pin-dots i.on { background: var(--gold-soft); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
.keypad button {
  min-height: 62px; border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--panel-2);
  font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; cursor: pointer;
}
.keypad button:active { transform: translateY(2px); }
.keypad svg { width: 30px; height: 30px; margin: 0 auto; }
.code-input { font-family: 'JetBrains Mono', monospace; font-size: 36px; font-weight: 700; letter-spacing: 0.2em; text-align: center; min-height: 56px; margin: 4px 0 12px; color: var(--gold-soft); }
.msg { padding: 12px 14px; border-radius: var(--radius-md); background: var(--panel-2); border: 1px solid var(--danger); font-weight: 600; margin: 12px 0; }

.teacher-levels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 12px; }
.teacher-levels button {
  border: 1px solid var(--hairline); background: var(--panel-2); border-radius: var(--radius-sm); min-height: 48px;
  font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; cursor: pointer; padding: 0;
}
.teacher-levels button[aria-checked="true"] { border-color: transparent; background: linear-gradient(160deg, var(--gold), var(--gold-deep)); color: var(--on-gold); }
.section-title { font-size: 18px; font-weight: 800; margin: 20px 0 8px; }
.sub-title { font-size: 15px; font-weight: 700; color: var(--text-dim); margin: 4px 0 8px; }

/* ---------- Запис ходів ---------- */
.game-layout { display: block; }
.moves { background: var(--panel); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 12px; margin-top: 14px; }
.moves-title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 18px; margin: 0 0 8px; color: var(--gold-soft); }
.moves-list {
  position: relative;
  display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 6px;
  min-height: 46px; max-height: 120px; overflow-y: auto;
  padding: 4px;
  background: var(--frame); border: 1px solid var(--hairline); border-radius: var(--radius-sm);
  font-family: 'JetBrains Mono', monospace; font-size: 16px; line-height: 1.2;
}
.moves-empty { padding: 9px 4px; color: var(--text-faint); font-family: 'Manrope', sans-serif; font-size: 14px; }
.mv-pair { display: inline-flex; align-items: center; white-space: nowrap; }
.mv-num { padding: 0 4px 0 2px; color: var(--text-faint); }
.mv {

<noscript><div class="wrap"><p class="msg">Для гри потрібно увімкнути JavaScript.</p></div></noscript>

<script>
/* ENGINE:START */
var MiniChess = (function () {
  'use strict';

  // Дошка 5×5. Клітинка = r * 5 + f, де f = 0..4 (a..e), r = 0..4 (ряд 1..5).
  // Білі (дитина) — знизу, ходять першими й рухаються вгору.
  var N = 5;
  var FILES = 'abcde';
  var VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
  var QUIET_LIMIT = 40;  // півходів без взяття й ходу пішака → нічия
  var WIN = 10000;

  // promo: 'win' — пішак на останньому ряду виграє; 'queen' — стає ферзем.
  // Рівні 2–5: фігура проти пішаків за одним правилом «не пропусти жодного пішака»:
  // пішак дійшов до 1-го ряду — програш, з'їли всіх або пішакам нікуди ходити — перемога.
  // Кількість і розстановку пішаків підібрано повним перебором (tests/levels.test.js):
  // фігура виграє, навіть коли пішаки грають найкраще, але не за 1–2 ходи.
  // king: перемога, коли з'їли короля; mate: справжні правила (шах, мат, пат).
  // stars: ліміти ходів дитини (білих) для зірочок, див. функцію stars().
  var LEVELS = [
    { setup: '5/ppppp/5/PPPPP/5', piece: 'p', rules: { promo: 'win' }, lim: { loss: 2, fast: 6 } },
    { setup: 'p3p/p3p/5/5/2R2', piece: 'r', rules: { promo: 'win' }, lim: { ok: 10, fast: 7 } },
    { setup: '1p1p1/1p1p1/5/5/B4', piece: 'b', rules: { promo: 'win' }, lim: { ok: 11, fast: 8 } },
    { setup: '1p1p1/1p1p1/5/5/3N1', piece: 'n', rules: { promo: 'win' }, lim: { ok: 13, fast: 10 } },
    { setup: 'ppppp/5/5/5/Q4', piece: 'q', rules: { promo: 'win' }, lim: { ok: 12, fast: 9 } },
    { setup: '2k2/ppppp/5/PPPPP/2K2', piece: 'k', rules: { promo: 'win', king: true }, lim: { loss: 2, fast: 8 } },
    { setup: 'rnbqk/ppppp/5/PPPPP/RNBQK', piece: 'all', rules: { promo: 'queen', king: true }, lim: { loss: 3, fast: 7 }, limReal: { loss: 3, fast: 9 } }
  ];
  var REAL_RULES = { promo: 'queen', mate: true };

  var DIRS = {
    r: [[1, 0], [-1, 0], [0, 1], [0, -1]],
    b: [[1, 1], [1, -1], [-1, 1], [-1, -1]],
    n: [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]]
  };
  DIRS.q = DIRS.r.concat(DIRS.b);
  DIRS.k = DIRS.q;

  function other(c) { return c === 'w' ? 'b' : 'w'; }
  function fileOf(sq) { return sq % N; }
  function rankOf(sq) { return (sq - sq % N) / N; }
  function sqName(sq) { return FILES.charAt(fileOf(sq)) + (rankOf(sq) + 1); }
  function sqIndex(name) { return (parseInt(name.charAt(1), 10) - 1) * N + FILES.indexOf(name.charAt(0)); }

  // Розстановка в стилі FEN: ряди від 5-го до 1-го через «/», цифра — порожні клітинки.
  function parse(setup) {
    var board = [], rows = setup.split('/'), id = 1, i, r, f, ch;
    for (i = 0; i < N * N; i++) board.push(null);
    for (i = 0; i < N; i++) {
      r = N - 1 - i;
      f = 0;
      for (var j = 0; j < rows[i].length; j++) {
        ch = rows[i].charAt(j);
        if (ch >= '1' && ch <= '5') { f += parseInt(ch, 10); continue; }
        board[r * N + f] = { c: ch === ch.toUpperCase() ? 'w' : 'b', t: ch.toLowerCase(), id: id++ };
        f++;
      }
    }
    return board;
  }

  function lastRank(c) { return c === 'w' ? N - 1 : 0; }

  // Ходи фігури без перевірки, чи не лишається свій король під шахом.
  function pseudoMoves(board, sq) {
    var p = board[sq], res = [], f = fileOf(sq), r = rankOf(sq), i, d, nf, nr, t;
    if (!p) return res;
    function add(to, cap) {
      res.push({ from: sq, to: to, capture: cap, promo: p.t === 'p' && rankOf(to) === lastRank(p.c) });
    }
    if (p.t === 'p') {
      nr = r + (p.c === 'w' ? 1 : -1);
      if (nr < 0 || nr >= N) return res;
      if (!board[nr * N + f]) add(nr * N + f, false);
      for (i = -1; i <= 1; i += 2) {
        nf = f + i;
        if (nf < 0 || nf >= N) continue;
        t = board[nr * N + nf];
        if (t && t.c !== p.c) add(nr * N + nf, true);
      }
      return res;
    }
    var dirs = DIRS[p.t], slide = p.t === 'r' || p.t === 'b' || p.t === 'q';
    for (i = 0; i < dirs.length; i++) {
      d = dirs[i];
      nf = f + d[0];
      nr = r + d[1];
      while (nf >= 0 && nf < N && nr >= 0 && nr < N) {
        t = board[nr * N + nf];
        if (t) {
          if (t.c !== p.c) add(nr * N + nf, true);
          break;
        }
        add(nr * N + nf, false);
        if (!slide) break;
        nf += d[0];
        nr += d[1];
      }
    }
    return res;
  }

  function makeBoard(board, m, rules) {
    var b = board.slice(), p = b[m.from];
    b[m.to] = (m.promo && rules.promo === 'queen') ? { c: p.c, t: 'q', id: p.id } : p;
    b[m.from] = null;
    return b;
  }

  function kingSquare(board, c) {
    for (var i = 0; i < board.length; i++) {
      if (board[i] && board[i].c === c && board[i].t === 'k') return i;
    }
    return -1;
  }

  function attacked(board, sq, by) {
    for (var i = 0; i < board.length; i++) {
      if (!board[i] || board[i].c !== by) continue;
      var ms = pseudoMoves(board, i);
      for (var j = 0; j < ms.length; j++) if (ms[j].to === sq) return true;
    }
    return false;
  }

  function inCheck(board, c) {
    var k = kingSquare(board, c);
    return k >= 0 && attacked(board, k, other(c));
  }

  // Усі ходи фігури на клітинці sq (незалежно від того, чия черга) — для підказки-крапок.
  function movesFrom(state, sq) {
    var p = state.board[sq];
    if (!p) return [];
    var ms = pseudoMoves(state.board, sq);
    if (!state.rules.mate) return ms;
    var res = [];
    for (var i = 0; i < ms.length; i++) {
      if (!inCheck(makeBoard(state.board, ms[i], state.rules), p.c)) res.push(ms[i]);
    }
    return res;
  }

  function legalMoves(state) {
    if (state.over) return [];
    var res = [];
    for (var i = 0; i < state.board.length; i++) {
      if (state.board[i] && state.board[i].c === state.turn) res = res.concat(movesFrom(state, i));
    }
    return res;
  }

  function countPieces(board, c) {
    var n = 0;
    for (var i = 0; i < board.length; i++) if (board[i] && board[i].c === c) n++;
    return n;
  }

  function onlyKings(board) {
    var any = false;
    for (var i = 0; i < board.length; i++) {
      if (!board[i]) continue;
      if (board[i].t !== 'k') return false;
      any = true;
    }
    return any;
  }

  // setup і turn — необов'язкові: довільна розстановка з правилами рівня (для тестів).
  function createGame(level, realRules, setup, turn) {
    var L = LEVELS[level - 1];
    var rules = (level === 7 && realRules) ? REAL_RULES : L.rules;
    var board = parse(setup || L.setup);
    return {
      level: level, rules: rules, board: board, turn: turn || 'w',
      start: { w: countPieces(board, 'w'), b: countPieces(board, 'b') },
      plies: 0, quiet: 0, over: false, winner: null, reason: '', last: null
    };
  }

  function finish(s, winner, reason) {
    s.over = true;
    s.winner = winner;
    s.reason = reason;
    return s;
  }

  // Новий стан після ходу m (хід має бути з legalMoves). reason:
  // promote — пішак дійшов; king — з'їли короля; all — з'їли всіх; nomoves — суперникові
  // нічим ходити; mate — мат; stalemate, kings, quiet — нічия.
  function applyMove(s, m) {
    var mover = s.board[m.from], captured = s.board[m.to], opp = other(mover.c);
    var b = makeBoard(s.board, m, s.rules);
    var ns = {
      level: s.level, rules: s.rules, board: b, turn: opp, start: s.start,
      plies: s.plies + 1,
      quiet: (captured || mover.t === 'p') ? 0 : s.quiet + 1,
      over: false, winner: null, reason: '',
      last: {
        from: m.from, to: m.to, capture: !!captured, promo: m.promo,
        piece: mover, captured: captured
      }
    };
    if (m.promo && s.rules.promo === 'win') return finish(ns, mover.c, 'promote');
    if (captured && captured.t === 'k') return finish(ns, mover.c, 'king');
    if (countPieces(b, opp) === 0) return finish(ns, mover.c, 'all');
    if (legalMoves(ns).length === 0) {
      if (!s.rules.mate) return finish(ns, mover.c, 'nomoves');
      return inCheck(b, opp) ? finish(ns, mover.c, 'mate') : finish(ns, null, 'stalemate');
    }
    if (onlyKings(b)) return finish(ns, null, 'kings');
    if (ns.quiet >= QUIET_LIMIT) return finish(ns, null, 'quiet');
    return ns;
  }

  function findMove(s, from, to) {
    var ms = legalMoves(s);
    for (var i = 0; i < ms.length; i++) if (ms[i].from === from && ms[i].to === to) return ms[i];
    return null;
  }

  // Скільки ходів зробили білі (дитина). Білі ходять першими.
  function whiteMoves(s) { return Math.ceil(s.plies / 2); }

  // Зірочки за перемогу білих. Від суперника (ведмедик, лисичка, вчитель) вони не залежать:
  //  1 — перемога;
  //  2 — у рівнях 1, 6, 7 (там є що втрачати): втрачено не більше lim.loss фігур;
  //      у рівнях 2–5 (там втрата фігури — це програш): не більше lim.ok ходів;
  //  3 — не більше lim.fast ходів (у рівнях 1, 6, 7 — і з другою зіркою).
  // Кожна наступна зірка потребує попередньої. Рівні 2–5: lim.fast = мінімум ходів проти
  // найкращого захисту пішаків (повний перебір) + 1 хід запасу, lim.ok = той мінімум + 4.
  // Повертає { stars, win, second, third, lost, moves, byLoss, loss, fast, ok }.
  function starInfo(s) {
    var L = LEVELS[s.level - 1];
    var lim = (s.rules.mate && L.limReal) ? L.limReal : L.lim;
    var r = { stars: 0, win: false, second: false, third: false, moves: whiteMoves(s),
      lost: s.start.w - countPieces(s.board, 'w'), byLoss: lim.loss !== undefined, loss: lim.loss, fast: lim.fast, ok: lim.ok || 0 };
    if (!s.over || s.winner !== 'w') return r;
    r.win = true;
    r.second = r.byLoss ? r.lost <= lim.loss : r.moves <= lim.ok;
    r.third = r.second && r.moves <= lim.fast;
    r.stars = 1 + (r.second ? 1 : 0) + (r.third ? 1 : 0);
    return r;
  }
  function stars(s) { return starInfo(s).stars; }

  /* ---------- Запис ходів ---------- */

  // Хід m у позиції s англійською алгебраїчною нотацією: e4, Nf3, exd5, Qxe5+, Rac1, d5=Q#.
  //  літери K Q R B N (пішак — без літери); x — взяття (у пішака перед x стоїть файл, звідки він пішов);
