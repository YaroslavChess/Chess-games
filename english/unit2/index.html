<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotlight Master: Unit 2 Academy</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px;
    }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 16px; }

    header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px;
    }
    .brand h1 { font-size: 19px; font-weight: 700; }
    .brand p { font-size: 13px; color: var(--text-muted); }

    .stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat-pill {
      background: rgba(0,0,0,0.25); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 8px; font-size: 13px; display: flex; gap: 6px;
    }
    .stat-val { font-weight: 700; color: var(--accent); }

    .controls-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px;
    }
    .control-group { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    select {
      background: #0f172a; color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    select:focus { border-color: var(--accent); outline: none; }
    select:disabled { opacity: 0.4; cursor: not-allowed; }

    .nav-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .tab-btn {
      background: var(--surface); color: var(--text-muted); border: 1px solid var(--border);
      padding: 12px 6px; border-radius: 8px; font-weight: 600; font-size: 13px;
      cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .tab-btn:hover { background: var(--surface-hover); color: var(--text); }
    .tab-btn.active { background: #0369a1; border-color: var(--accent); color: #fff; }

    .workspace {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 28px; min-height: 480px; display: flex; flex-direction: column; justify-content: space-between;
    }

    .prompt-box { text-align: center; margin-bottom: 24px; }
    .prompt-label {
      text-transform: uppercase; font-size: 11px; letter-spacing: 1.2px;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .prompt-content {
      font-size: 26px; font-weight: 700; color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    }

    .audio-btn {
      background: none; border: none; color: var(--accent); cursor: pointer;
      font-size: 20px; line-height: 1; display: inline-flex; align-items: center;
    }
    .audio-btn:hover { transform: scale(1.15); }

    .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .opt-btn {
      background: #0f172a; border: 1px solid var(--border); color: var(--text);
      padding: 16px; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; text-align: left; transition: border 0.15s, background 0.15s;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--surface-hover); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); color: #86efac; }
    .opt-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: #fca5a5; }

    .typing-box { display: flex; gap: 10px; margin-bottom: 24px; justify-content: center; }
    .typing-input {
      background: #0f172a; border: 2px solid var(--border); color: #fff;
      font-size: 18px; font-weight: 600; padding: 12px 18px; border-radius: 8px;
      width: 100%; max-width: 440px;
    }
    .typing-input:focus { border-color: var(--accent); outline: none; }
    .typing-input.correct { border-color: var(--success); color: #86efac; }
    .typing-input.incorrect { border-color: var(--danger); color: #fca5a5; }

    .comp-builder { display: flex; flex-direction: column; gap: 16px; max-width: 600px; margin: 0 auto 20px; }
    .comp-step { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .comp-step-title { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .comp-choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice-pill {
      background: var(--surface); border: 1px solid var(--border); color: #fff;
      padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .choice-pill:hover:not(:disabled) { border-color: var(--accent); }
    .choice-pill:disabled { cursor: default; }
    .choice-pill.selected { background: var(--accent); color: #0b1120; border-color: var(--accent); }
    .choice-pill.right { background: rgba(34, 197, 94, 0.25); border-color: var(--success); color: #86efac; }
    .choice-pill.wrong { background: rgba(239, 68, 68, 0.25); border-color: var(--danger); color: #fca5a5; }

    .comp-topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; }
    .stage-badge {
      font-size: 13px; font-weight: 700; color: var(--accent);
      background: rgba(0,0,0,0.25); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px;
    }
    .rule-btn {
      background: transparent; color: var(--accent); border: 1px solid var(--accent);
      padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .rule-btn:hover { background: rgba(56, 189, 248, 0.15); }
    .rule-card { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 22px; max-width: 600px; margin: 0 auto; }
    .rule-card h2 { font-size: 20px; margin-bottom: 10px; }
    .rule-intro { color: var(--text-muted); font-size: 14px; margin-bottom: 10px; }
    .rule-list { padding-left: 22px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.4; }
    .rule-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .rule-overlay .rule-card { width: 100%; }
    .rule-note { margin-top: 10px; font-size: 14px; color: #fca5a5; line-height: 1.4; }
    .rule-why { font-weight: 400; }
    .comp-builder [hidden] { display: none; }
    .rule-note.ok { color: #86efac; }
    label.comp-step-title { display: block; }
    .comp-step .typing-input { max-width: none; }
    .from-last {
      display: inline-block; margin-bottom: 8px; padding: 3px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--warning); border: 1px solid var(--warning); background: rgba(245, 158, 11, 0.12);
    }

    .feedback-banner {
      min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600;
      background: rgba(0,0,0,0.25); border: 1px solid var(--border);
    }
    .feedback-banner.success { background: rgba(34, 197, 94, 0.15); border-color: var(--success); color: #86efac; }
    .feedback-banner.error { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: #fca5a5; }

    .action-btn {
      background: var(--accent); color: #0b1120; border: none;
      padding: 10px 20px; font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer;
    }
    .action-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .action-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .report-wrap { width: 100%; overflow-x: auto; margin: 16px 0; }
    .report-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
    .report-table th, .report-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .report-table th { background: #0f172a; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }

    @media (max-width: 600px) {
      .grid-options { grid-template-columns: 1fr; }
      .nav-tabs { grid-template-columns: 1fr 1fr; }
      .workspace { padding: 18px; }
      .prompt-content { font-size: 22px; }
    }
  </style>
</head>

let currentMode = 'vocab';
let stats = { correct: 0, total: 0, streak: 0 };
let activeQueue = [];
let retryQueue = [];
let currentItem = null;
let currentAnswer = '';
let missedLog = [];

/* Error logic (Core Vocab type-in, Comparison, Adverbs, Mine/Yours) */
let retryKeys = new Set();      // words waiting for their one extra try in this round
let currentIsRetry = false;     // the current card is that extra try
let sessionBanned = new Set();  // wrong twice: saved for next time, not shown again in this session
let fromLastKeys = new Set();   // saved words from an earlier session ("From last time")
let roundFirstOk = 0;           // correct at the first try in this round
let roundSize = 0;
const VOCAB_ROUND = 12;
const VOCAB_ROUND_SAVED = 6;

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function unique(arr) { return [...new Set(arr)]; }

function speakUK(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = String(text).replace(/\(.*?\)/g, '').replace(/➔.*/, '').trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-GB';
  u.rate = 0.88;
  window.speechSynthesis.speak(u);
}

function speakBtn(text) {
  return `<button class="audio-btn" data-say="${esc(text)}" onclick="speakUK(this.dataset.say)" aria-label="Listen">🔊</button>`;
}

function refreshStats() {
  document.getElementById('queueCount').innerText = activeQueue.length + retryQueue.length;
  document.getElementById('streakVal').innerText = stats.streak;
  const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 100;
  document.getElementById('accuracyVal').innerText = acc + '%';
}

function record(isCorrect) {
  stats.total++;
  if (isCorrect) { stats.correct++; stats.streak++; } else { stats.streak = 0; }
  refreshStats();
}

function showResult(bannerId, ok, html) {
  const banner = document.getElementById(bannerId);
  banner.className = 'feedback-banner ' + (ok ? 'success' : 'error');
  banner.innerHTML = `<span>${html}</span> <button class="action-btn" id="nextBtn" onclick="runNextCard()">Next ➔</button>`;
  document.getElementById('nextBtn').focus();
}

/* After a mistake: Next stays disabled until the correct answer is typed */
function showRetype(bannerId, html) {
  const banner = document.getElementById(bannerId);
  banner.className = 'feedback-banner error';
  banner.innerHTML = `<span>${html}</span> <button class="action-btn" id="nextBtn" onclick="runNextCard()" disabled>Next ➔</button>`;
}

/* ==========================================================================
   LOCAL STORAGE (per student + mode; never breaks the trainer)
   ========================================================================== */
const LS_PREFIX = 'u2:' + STUDENT + ':';

function lsGet(name, fallback) {
  try {
    const v = localStorage.getItem(LS_PREFIX + name);
    return v === null ? fallback : JSON.parse(v);
  } catch (e) { return fallback; }
}

function lsSet(name, value) {
  try { localStorage.setItem(LS_PREFIX + name, JSON.stringify(value)); } catch (e) {}
}

function lsList(name) {
  const a = lsGet(name, []);
  return Array.isArray(a) ? a.filter(x => typeof x === 'string') : [];
}

function lsListAdd(name, value) {
  const a = lsList(name);
  if (!a.includes(value)) { a.push(value); lsSet(name, a); }
}

function lsListRemove(name, value) {
  const a = lsList(name);
  const i = a.indexOf(value);
  if (i >= 0) { a.splice(i, 1); lsSet(name, a); }
}

function modeData(mode) {
  if (mode === 'vocab') return FULL_DATABASE;
  if (mode === 'comparisons') return COMPARISON_TRAPS;
  if (mode === 'adverbs') return ADVERB_DATA;
  if (mode === 'pronouns') return PRONOUN_DATA;
  return COLLOCATIONS_DATA;
}

function itemKey(item) {
  return item.en || item.base || item.adj || item.phrase || item.stem;
}

/* Saved mistakes of a mode, without words already wrong twice in this session */
function savedItems(mode) {
  const data = modeData(mode);
  return lsList(mode + ':mistakes')
    .filter(k => !sessionBanned.has(k))
    .map(k => data.find(i => itemKey(i) === k))
    .filter(Boolean);
}

function scopePool() {
  const scope = document.getElementById('setFilter').value;
  return scope === 'ALL' ? FULL_DATABASE : FULL_DATABASE.filter(i => i.cat === scope);
}

function isStrictMode() {
  if (currentMode === 'vocab') return document.getElementById('inputModeSelect').value === 'type';
  return currentMode === 'comparisons' || currentMode === 'adverbs' || currentMode === 'pronouns';
}

function vocabRoundMode() {
  return IS_STUDENT && currentMode === 'vocab' && document.getElementById('inputModeSelect').value === 'type';
}

function fromLastBadge() {
  return currentItem && !currentIsRetry && fromLastKeys.has(itemKey(currentItem))
    ? '<div class="from-last">From last time</div>' : '';
}

/* Shared outcome of the first answer (not the re-typing after a mistake) */
function strictOutcome(ok, mKey, mAnswer) {
  const key = itemKey(currentItem);
  record(ok);
  if (ok) {
    if (!currentIsRetry) {
      roundFirstOk++;
      lsListRemove(currentMode + ':mistakes', key);
      if (vocabRoundMode()) lsListAdd('vocab:learned', key);
    }
    return;
  }
  logMistake(mKey, mAnswer, currentItem);
  if (currentIsRetry) {
    lsListAdd(currentMode + ':mistakes', key);
    sessionBanned.add(key);
  } else {
    retryQueue.push(currentItem);
    retryKeys.add(key);
  }
}

function applyStudentMode() {
  if (!IS_STUDENT) return;
  const hide = id => { document.getElementById(id).style.display = 'none'; };
  document.getElementById('inputModeSelect').value = URL_PARAMS.get('input') === 'choice' ? 'choice' : 'type';
  document.getElementById('dirSelect').value = 'DE_EN';
  hide('grpDir');
  hide('grpInput');
  const set = URL_PARAMS.get('set');
  const sel = document.getElementById('setFilter');
  if (set && [...sel.options].some(o => o.value === set)) {
    sel.value = set;
    hide('grpScope');
    hide('controlsBar');
  }
}

function switchMode(mode) {
  currentMode = mode;
  const order = ['vocab', 'comparisons', 'adverbs', 'pronouns', 'collocations'];
  document.querySelectorAll('.nav-tabs .tab-btn').forEach((b, idx) => {
    b.classList.toggle('active', order[idx] === mode);
  });
  const vocabOnly = mode !== 'vocab';
  ['setFilter', 'dirSelect', 'inputModeSelect'].forEach(id => {
    document.getElementById(id).disabled = vocabOnly;
  });
  initSession();
}

function initSession(practiceOnlyMissed) {
  practiceOnlyMissed = practiceOnlyMissed === true;
  trackSessionStart(practiceOnlyMissed);
  stats = { correct: 0, total: 0, streak: 0 };
  retryQueue = [];
  retryKeys = new Set();
  sessionBanned = new Set();
  fromLastKeys = new Set();
  roundFirstOk = 0;

  if (practiceOnlyMissed) {
    activeQueue = shuffle(missedLog.map(m => m.rawItem));
  } else if (currentMode === 'comparisons' || vocabRoundMode()) {
    activeQueue = [];   // rounds are built by startCompRound / startVocabRound
  } else if (currentMode === 'collocations') {
    activeQueue = shuffle(COLLOCATIONS_DATA);
  } else {
    const pool = currentMode === 'vocab' ? scopePool() : modeData(currentMode);
    const saved = isStrictMode() ? savedItems(currentMode) : [];
    fromLastKeys = new Set(saved.map(itemKey));
    activeQueue = [...shuffle(saved), ...shuffle(pool.filter(i => !fromLastKeys.has(itemKey(i))))];
  }
  missedLog = [];
  roundSize = activeQueue.length;
  refreshStats();
  if (practiceOnlyMissed) runNextCard();
  else if (currentMode === 'comparisons') { loadCompProgress(); renderCompRuleScreen(); }
  else if (vocabRoundMode()) startVocabRound(false);
  else runNextCard();
}

function runNextCard() {
  if (activeQueue.length === 0) {
    if (retryQueue.length > 0) {
      activeQueue = shuffle(retryQueue);
      retryQueue = [];
    } else {
      if (currentMode === 'comparisons') { renderCompRoundDone(); return; }
      if (vocabRoundMode()) { renderVocabRoundDone(); return; }
      renderCompletionScreen();
      return;
    }
  }
  currentItem = activeQueue.shift();
  const key = itemKey(currentItem);
  currentIsRetry = retryKeys.has(key);
  if (currentIsRetry) retryKeys.delete(key);
  refreshStats();

  if (currentMode === 'vocab') renderVocabCard();
  else if (currentMode === 'comparisons') renderComparisonCard();
  else if (currentMode === 'adverbs' || currentMode === 'pronouns') renderGrammarCard();
  else renderCollocationCard();
}

function logMistake(key, answer, raw) {
  const existing = missedLog.find(m => m.key === key);
  if (existing) existing.attempts++;
  else missedLog.push({ key, answer, rawItem: raw, attempts: 1 });
}

/* ==========================================================================
   RESULT TRACKING (silent; never affects the trainer if sending fails)
   ========================================================================== */
const TAB_NAMES = {
  vocab: '1. Core Vocab',
  comparisons: '2. Comparison',
  adverbs: '3. Adverbs',
  pronouns: '4. Mine/Yours',
  collocations: '5. Collocations'
};
let session = null;

function selectedText(id) {
  const el = document.getElementById(id);
  return el && el.selectedIndex >= 0 ? el.options[el.selectedIndex].text : '';
}

function sendResult(data, useBeacon) {
  try {
    if (!SHEET_URL) return;
    const body = JSON.stringify(data);
    if (useBeacon && navigator.sendBeacon) {
      navigator.sendBeacon(SHEET_URL, new Blob([body], { type: 'text/plain;charset=UTF-8' }));
      return;
    }
    fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: body,
      keepalive: true
    }).catch(function () {});
  } catch (e) { /* tracking must never break the trainer */ }
}

function trackSessionStart(practiceOnlyMissed) {
  try {
    trackSessionEnd('interrupted', false);
    const vocab = currentMode === 'vocab';
    session = {
      start: Date.now(),
      tab: TAB_NAMES[currentMode] || currentMode,
      scope: vocab ? selectedText('setFilter') + (practiceOnlyMissed ? ' [missed only]' : '') : '-',
      direction: vocab ? selectedText('dirSelect') : '-',
      input: vocab ? selectedText('inputModeSelect') : '-',
      sent: false
    };
  } catch (e) { session = null; }
}

function trackAnswer(question, given, correct, ok) {
  try {
    if (!session) return;
    sendResult({
      kind: 'answer',
      ts: new Date().toISOString(),
      student: STUDENT,
      tab: session.tab,
      settings: [session.scope, session.direction, session.input].join(' | '),
      question: String(question),
      given: String(given),
      correct: String(correct),
      ok: !!ok
    }, false);
  } catch (e) {}
}

function trackSessionEnd(status, useBeacon) {
  try {
    if (!session || session.sent || stats.total === 0) return;
    session.sent = true;
    sendResult({
      kind: 'session',
      ts: new Date(session.start).toISOString(),
      student: STUDENT,
      tab: session.tab,
      scope: session.scope,
      direction: session.direction,
      input: session.input,
      duration: Math.round((Date.now() - session.start) / 1000),
      cards: stats.total,
      accuracy: Math.round((stats.correct / stats.total) * 100),
      mistakes: missedLog.map(m => ({ q: m.key, a: m.answer, n: m.attempts })),
      status: status
    }, useBeacon);
  } catch (e) {}
}

window.addEventListener('pagehide', function () { trackSessionEnd('interrupted', true); });

/* ==========================================================================
   MODE 1: CORE VOCABULARY
   ========================================================================== */
function normalize(s) {
  return String(s).toLowerCase()
    .replace(/\(.*?\)/g, '')
    .replace(/[.!?]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function stripLead(s) {
  return s.replace(/^to /, '').replace(/^(der|die|das) /, '');
}

// Accepts: either variant of "A, B", with or without the bracketed part,
// with or without "to" before verbs and der/die/das before nouns, final punctuation optional.
function isTypedCorrect(input, answer) {
  const accepted = new Set();
  const parts = [answer, ...answer.split(',')];
  parts.forEach(p => {
    const n = normalize(p);
    if (!n) return;
    accepted.add(n);
    accepted.add(stripLead(n));
  });
  const u = normalize(input);
  if (!u) return false;
  return accepted.has(u) || accepted.has(stripLead(u));
}

function renderVocabCard() {
  const dir = document.getElementById('dirSelect').value;
  const inputMode = document.getElementById('inputModeSelect').value;
  const promptText = dir === 'DE_EN' ? currentItem.de : currentItem.en;
  currentAnswer = dir === 'DE_EN' ? currentItem.en : currentItem.de;
  const ws = document.getElementById('appWorkspace');

  let interactionHTML = '';
  if (inputMode === 'type') {
    interactionHTML = typingBoxHTML();
  } else {
    const sameCat = FULL_DATABASE.filter(x => x.en !== currentItem.en && x.cat === currentItem.cat);
    const otherCat = FULL_DATABASE.filter(x => x.en !== currentItem.en && x.cat !== currentItem.cat);
    const distractors = sameCat.length >= 3 ? shuffle(sameCat).slice(0, 3) : shuffle([...sameCat, ...otherCat]).slice(0, 3);
    const options = shuffle(unique([currentItem, ...distractors].map(x => dir === 'DE_EN' ? x.en : x.de)));
    interactionHTML = `
      <div class="grid-options" id="vocabGrid">
        ${options.map(opt => `<button class="opt-btn" data-val="${esc(opt)}" onclick="checkVocabChoice(this)">${esc(opt)}</button>`).join('')}
      </div>`;
  }

  ws.innerHTML = `
    <div>
      <div class="prompt-box">
        ${fromLastBadge()}
        <div class="prompt-label">Translate (${dir === 'DE_EN' ? 'DE ➔ EN' : 'EN ➔ DE'})</div>
        <div class="prompt-content">
          ${esc(promptText)}
          ${dir === 'EN_DE' ? speakBtn(currentItem.en) : ''}
        </div>
      </div>
      ${interactionHTML}
    </div>
    <div class="feedback-banner" id="fbBanner">
      <span>${inputMode === 'type' ? 'Type the translation and press Enter' : 'Choose the correct match'}</span>
    </div>`;

  if (inputMode === 'type') bindTypeInput();
}

/* ==========================================================================
   SHARED TYPE-IN FLOW (Core Vocab type-in, Adverbs, Mine/Yours)
   ========================================================================== */
let retypeActive = false;

function typingBoxHTML() {
  return `
      <div class="typing-box">
        <input type="text" class="typing-input" id="typeInput" placeholder="Type answer..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="action-btn" id="submitBtn" onclick="submitTyped()">Submit</button>
      </div>`;
}

function bindTypeInput() {
  retypeActive = false;
  const inp = document.getElementById('typeInput');
  inp.focus();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      if (!inp.disabled) submitTyped();
    }
  });
  inp.addEventListener('input', () => { if (retypeActive) updateRetype(); });
}

/* What to check, send and explain for the current card */
function typedInfo() {
  if (currentMode === 'vocab') {
    const deEn = document.getElementById('dirSelect').value === 'DE_EN';
    return {
      question: deEn ? currentItem.de : currentItem.en,
      speak: currentItem.en,
      rule: '',
      mKey: currentItem.en,
      mAnswer: currentItem.de,
      match: t => isTypedCorrect(t, currentAnswer)
    };
  }
  const question = currentMode === 'adverbs' ? currentItem.adj : currentItem.phrase;
  return {
    question: question,
    speak: currentAnswer,
    rule: currentItem.rule || '',
    mKey: question,
    mAnswer: currentAnswer,
    match: t => normalize(t) === normalize(currentAnswer)
  };
}

function submitTyped() {
  const inp = document.getElementById('typeInput');
  const info = typedInfo();
  if (retypeActive) {
    if (info.match(inp.value)) runNextCard();
    else inp.focus();
    return;
  }
  const typed = inp.value.trim();
  if (!typed) { inp.focus(); return; }
  const ok = info.match(typed);
  speakUK(info.speak);
  trackAnswer(info.question, typed, currentAnswer, ok);
  strictOutcome(ok, info.mKey, info.mAnswer);

  const submit = document.getElementById('submitBtn');
  if (ok) {
    inp.disabled = true;
    submit.disabled = true;
    inp.classList.add('correct');
    const note = currentMode === 'vocab' && normalize(typed) !== normalize(currentAnswer) ? ` Full form: <strong>${esc(currentAnswer)}</strong>` : '';
    showResult('fbBanner', true, 'Correct!' + note);
  } else {
    retypeActive = true;
    inp.value = '';
    inp.classList.add('incorrect');
    inp.placeholder = 'Type the correct answer...';
    submit.style.display = 'none';
    const rule = info.rule ? `<br><span class="rule-why">${esc(info.rule)}</span>` : '';
    showRetype('fbBanner', `Correct: <strong>${esc(currentAnswer)}</strong>${rule}`);
    inp.focus();
  }
}

/* Re-typing after a mistake: not sent to the sheet, not counted */
function updateRetype() {
  const inp = document.getElementById('typeInput');
  const ok = typedInfo().match(inp.value);
  inp.classList.toggle('correct', ok);
  inp.classList.toggle('incorrect', !ok);
  const next = document.getElementById('nextBtn');
  if (next) next.disabled = !ok;
}

/* ==========================================================================
   CORE VOCAB ROUNDS (student mode, type-in)
   ========================================================================== */
function vocabWordsLeft() {
  const learned = new Set(lsList('vocab:learned'));
  return scopePool().filter(i => !learned.has(i.en)).length;
}

function startVocabRound(practice) {
  trackSessionStart(false);
  stats = { correct: 0, total: 0, streak: 0 };
  missedLog = [];
  retryQueue = [];
  retryKeys = new Set();
  roundFirstOk = 0;

  const saved = savedItems('vocab').slice(0, VOCAB_ROUND_SAVED);
  fromLastKeys = new Set(saved.map(itemKey));
  const learned = new Set(lsList('vocab:learned'));
  const free = scopePool().filter(i => !fromLastKeys.has(i.en));
  let pool = free.filter(i => !sessionBanned.has(i.en) && (practice || !learned.has(i.en)));
  if (practice && pool.length === 0) pool = free;
  activeQueue = [...shuffle(saved), ...shuffle(pool).slice(0, VOCAB_ROUND - saved.length)];
  roundSize = activeQueue.length;
  refreshStats();
  if (roundSize === 0) { renderVocabEmpty(); return; }
  runNextCard();
}

function renderVocabRoundDone() {
  trackSessionEnd('completed', false);
  const left = vocabWordsLeft();
  document.getElementById('appWorkspace').innerHTML = `
    <div style="text-align: center; margin: auto; max-width: 640px; width: 100%;">
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">Round done: ${roundFirstOk}/${roundSize}. Words left: ${left}</h2>
      ${left === 0 ? '<p style="color: var(--success); font-weight: 600; margin: 16px 0;">All words learned!</p>' : ''}
      <div style="margin-top: 20px;">
        <button class="action-btn" id="roundBtn" onclick="startVocabRound(${left === 0})">${left === 0 ? 'Practise again' : 'Next round'}</button>
      </div>
    </div>`;
  document.getElementById('roundBtn').focus();
}

function renderVocabEmpty() {
  const left = vocabWordsLeft();
  document.getElementById('appWorkspace').innerHTML = `
    <div style="text-align: center; margin: auto; max-width: 640px; width: 100%;">
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">${left === 0 ? 'All words learned!' : 'Your remaining words come back next time.'}</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Words left: ${left}</p>
      <div style="margin-top: 20px;">
        <button class="action-btn" id="roundBtn" onclick="startVocabRound(true)">Practise again</button>
      </div>
    </div>`;
  document.getElementById('roundBtn').focus();
}

function checkVocabChoice(btn) {
  const isCorrect = btn.dataset.val === currentAnswer;
  const grid = document.getElementById('vocabGrid');
  grid.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (!isCorrect && b.dataset.val === currentAnswer) b.classList.add('correct');
  });
  btn.classList.add(isCorrect ? 'correct' : 'incorrect');
  handleVocabOutcome(isCorrect, '', btn.dataset.val);
}

function handleVocabOutcome(isCorrect, typed, given) {
  speakUK(currentItem.en);
  trackAnswer(document.getElementById('dirSelect').value === 'DE_EN' ? currentItem.de : currentItem.en, given, currentAnswer, isCorrect);
  if (isCorrect) {
    const note = typed && normalize(typed) !== normalize(currentAnswer) ? ` Full form: <strong>${esc(currentAnswer)}</strong>` : '';
    record(true);
    showResult('fbBanner', true, 'Correct!' + note);
  } else {
    logMistake(currentItem.en, currentItem.de, currentItem);
    retryQueue.push(currentItem);
    record(false);
    showResult('fbBanner', false, `Correct: <strong>${esc(currentAnswer)}</strong>`);
  }
}

/* ==========================================================================
   MODE 2: COMPARISON
   ========================================================================== */
/* Which rule applies to each word + one-line explanation (German) */
const COMP_WORD_RULES = {
  tall: ['er', 'tall – kurzes Wort, zwei Konsonanten am Ende (ll) → einfach -er: taller'],
  long: ['er', 'long – kurzes Wort, zwei Konsonanten am Ende (ng) → einfach -er: longer'],
  cold: ['er', 'cold – kurzes Wort, zwei Konsonanten am Ende (ld) → einfach -er: colder'],
  cool: ['er', 'cool – zwei Vokale (oo) vor dem l → nicht verdoppeln: cooler'],
  small: ['er', 'small – kurzes Wort, zwei Konsonanten am Ende (ll) → einfach -er: smaller'],
  short: ['er', 'short – kurzes Wort, zwei Konsonanten am Ende (rt) → einfach -er: shorter'],
  old: ['er', 'old – kurzes Wort, zwei Konsonanten am Ende (ld) → einfach -er: older'],
  young: ['er', 'young – kurzes Wort, zwei Konsonanten am Ende (ng) → einfach -er: younger'],
  cheap: ['er', 'cheap – zwei Vokale (ea) vor dem p → nicht verdoppeln: cheaper'],
  big: ['double', 'big – kurzes Wort, Vokal + Konsonant am Ende → g verdoppeln: bigger'],
  hot: ['double', 'hot – kurzes Wort, Vokal + Konsonant am Ende → t verdoppeln: hotter'],
  sad: ['double', 'sad – kurzes Wort, Vokal + Konsonant am Ende → d verdoppeln: sadder'],
  thin: ['double', 'thin – kurzes Wort, Vokal + Konsonant am Ende → n verdoppeln: thinner'],
  wet: ['double', 'wet – kurzes Wort, Vokal + Konsonant am Ende → t verdoppeln: wetter'],
  large: ['e', 'large – Endung -e → nur -r / -st: larger'],
  nice: ['e', 'nice – Endung -e → nur -r / -st: nicer'],
  late: ['e', 'late – Endung -e → nur -r / -st: later'],
  safe: ['e', 'safe – Endung -e → nur -r / -st: safer'],
  happy: ['y', 'happy – Endung -y → y wird zu i: happier'],
  funny: ['y', 'funny – Endung -y → y wird zu i: funnier'],
  crazy: ['y', 'crazy – Endung -y → y wird zu i: crazier'],
  dirty: ['y', 'dirty – Endung -y → y wird zu i: dirtier'],
  easy: ['y', 'easy – Endung -y → y wird zu i: easier'],
  cheeky: ['y', 'cheeky – Endung -y → y wird zu i: cheekier'],
  good: ['special', 'good – Sonderform: better, the best'],
  bad: ['special', 'bad – Sonderform: worse, the worst'],
  beautiful: ['more', 'beau-ti-ful – 3 Silben → more / the most: more beautiful'],
  interesting: ['more', 'in-te-res-ting – 4 Silben → more / the most: more interesting'],
  dangerous: ['more', 'dan-ge-rous – 3 Silben → more / the most: more dangerous'],
  exciting: ['more', 'ex-ci-ting – 3 Silben → more / the most: more exciting'],
  expensive: ['more', 'ex-pen-sive – 3 Silben → more / the most: more expensive'],
  colourful: ['more', 'co-lour-ful – 3 Silben → more / the most: more colourful'],
  comfortable: ['more', 'com-for-ta-ble – 4 Silben → more / the most: more comfortable'],
  attractive: ['more', 'at-trac-tive – 3 Silben → more / the most: more attractive']
};

const COMP_ALGORITHM = [
  'good / bad → better, the best / worse, the worst',
  '3 Silben oder mehr → more / the most',
  'Endung -y → y wird zu i: happier, the happiest',
  'Endung -e → nur -r / -st: larger, the largest',
  'kurzes Wort, endet auf EINEN Vokal + EINEN Konsonanten → verdoppeln: bigger, the hottest. Zwei Vokale (cool) oder zwei Konsonanten (tall) → einfach -er',
  'alles andere → -er / -est'
];

/* Stages: null = all words mixed */
const COMP_STAGE_1 = ['tall', 'long', 'cold', 'cool', 'small', 'short', 'old', 'young', 'cheap'];
const COMP_STAGE_2 = ['big', 'hot', 'sad', 'thin', 'wet', 'large', 'nice', 'late', 'safe'];
const COMP_STAGES = [
  COMP_STAGE_1,
  COMP_STAGE_2,
  COMP_STAGE_1.concat(COMP_STAGE_2),
  ['happy', 'funny', 'crazy', 'dirty', 'easy', 'cheeky', 'good', 'bad'],
  ['beautiful', 'interesting', 'dangerous', 'exciting', 'expensive', 'colourful', 'comfortable', 'attractive'],
  null
];

const COMP_ROUND = 8;         // words per round
const COMP_PASS = 6;          // correct at the first try to pass the stage
const COMP_ROUND_SAVED = 3;   // max. "From last time" words per round
const COMP_MAX_FAILS = 3;     // after this many failed rounds in a row "Next stage" is offered

let compStage = 0;            // index in COMP_STAGES (saved in localStorage)
let compFails = 0;            // failed rounds in a row at this stage (saved in localStorage)
let compRetype = false;

function compStageItems(i) {
  const names = COMP_STAGES[i];
  return names ? COMPARISON_TRAPS.filter(it => names.includes(it.base)) : [...COMPARISON_TRAPS];
}

function compWordRule(item) {
  return COMP_WORD_RULES[(item || currentItem).base] || ['er', ''];
}

function loadCompProgress() {
  const s = lsGet('comparisons:stage', 0);
  const f = lsGet('comparisons:fails', 0);
  compStage = Number.isInteger(s) && s >= 0 && s < COMP_STAGES.length ? s : 0;
  compFails = Number.isInteger(f) && f >= 0 ? f : 0;
}

function saveCompProgress() {
  lsSet('comparisons:stage', compStage);
  lsSet('comparisons:fails', compFails);
}

/* Correct forms with the changed letters in bold: bi<strong>gg</strong>er, happ<strong>ier</strong> */
function compFormsHTML(item) {
  const b = esc(item.base);
  const s = x => `<strong>${esc(x)}</strong>`;
  const rule = compWordRule(item)[0];
  let forms;
  if (rule === 'er') forms = [b + s('er'), 'the ' + b + s('est')];
  else if (rule === 'double') {
    const stem = esc(item.base.slice(0, -1));
    const dd = item.base.slice(-1).repeat(2);
    forms = [stem + s(dd) + 'er', 'the ' + stem + s(dd) + 'est'];
  } else if (rule === 'e') forms = [b + s('r'), 'the ' + b + s('st')];
  else if (rule === 'y') {
    const stem = esc(item.base.slice(0, -1));
    forms = [stem + s('ier'), 'the ' + stem + s('iest')];
  } else if (rule === 'more') forms = [s('more') + ' ' + b, 'the ' + s('most') + ' ' + b];
  else forms = [s(item.comp), 'the ' + s(item.sup.replace(/^the /, ''))];
  const plain = h => h.replace(/<\/?strong>/g, '');
  if (plain(forms[0]) !== esc(item.comp) || plain(forms[1]) !== esc(item.sup)) {
    forms = [esc(item.comp), esc(item.sup)];
  }
  return forms;
}

function compAlgorithmHTML() {
  return `
    <p class="rule-intro">Der Reihe nach prüfen – beim ersten „Ja“ stoppen:</p>
    <ol class="rule-list">${COMP_ALGORITHM.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
}

function compTopBar() {
  const label = `Stage ${compStage + 1} of ${COMP_STAGES.length}`;
  return `
    <div class="comp-topbar">
      <span class="stage-badge">${label}</span>
      <button class="rule-btn" onclick="openCompRule()">Rule</button>
    </div>`;
}

function renderCompRuleScreen() {
  document.getElementById('appWorkspace').innerHTML = `
    <div>
      ${compTopBar()}
      <div class="rule-card">
        <h2>Rule</h2>
        ${compAlgorithmHTML()}
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
          <button class="action-btn" id="compStartBtn" onclick="startCompRound()">Start</button>
          <button class="rule-btn" onclick="restartCompStages()">Start from stage 1</button>
        </div>
      </div>
    </div>`;
  document.getElementById('compStartBtn').focus();
}

function openCompRule() {
  closeCompRule();
  const ov = document.createElement('div');
  ov.id = 'compRuleOverlay';
  ov.className = 'rule-overlay';
  ov.innerHTML = `
    <div class="rule-card" role="dialog" aria-modal="true">
      <h2>Rule</h2>
      ${compAlgorithmHTML()}
      <button class="action-btn" id="compRuleClose" onclick="closeCompRule()">Close</button>
    </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeCompRule(); });
  ov.addEventListener('keydown', e => { if (e.key === 'Escape') closeCompRule(); });
  document.body.appendChild(ov);
  document.getElementById('compRuleClose').focus();
}

function closeCompRule() {
  const ov = document.getElementById('compRuleOverlay');
  if (ov) ov.remove();
}

function startCompRound() {
  closeCompRule();
  trackSessionStart(false);
  stats = { correct: 0, total: 0, streak: 0 };
  missedLog = [];
  retryQueue = [];
  retryKeys = new Set();
  roundFirstOk = 0;

  const saved = savedItems('comparisons').slice(0, COMP_ROUND_SAVED);
  fromLastKeys = new Set(saved.map(itemKey));
  const free = compStageItems(compStage).filter(i => !fromLastKeys.has(i.base));
  let pool = free.filter(i => !sessionBanned.has(i.base));
  if (pool.length === 0) pool = free;
  activeQueue = [...shuffle(saved), ...shuffle(pool).slice(0, COMP_ROUND - saved.length)];
  roundSize = activeQueue.length;
  refreshStats();
  runNextCard();
}

function restartCompStages() {
  compStage = 0;
  compFails = 0;
  saveCompProgress();
  startCompRound();
}

function skipCompStage() {
  if (compStage < COMP_STAGES.length - 1) compStage++;
  compFails = 0;
  saveCompProgress();
  startCompRound();
}

/* Pass mark counts only first tries; the repeat at the end of the round does not count */
function renderCompRoundDone() {
  trackSessionEnd('completed', false);
  const need = roundSize >= COMP_ROUND ? COMP_PASS : Math.ceil(roundSize * COMP_PASS / COMP_ROUND);
  const passed = roundFirstOk >= need;
  const stageNum = compStage + 1;
  const isLast = compStage === COMP_STAGES.length - 1;
  const topBar = compTopBar();

  if (passed) {
    compFails = 0;
    if (!isLast) compStage++;
  } else {
    compFails++;
  }
  saveCompProgress();

  const btn = (id, onclick, text, extraStyle) =>
    `<button class="action-btn" id="${id}" onclick="${onclick}"${extraStyle ? ` style="${extraStyle}"` : ''}>${text}</button>`;
  let title, info = '', buttons;
  if (passed && isLast) {
    title = 'All stages done!';
    buttons = btn('compRoundBtn', 'startCompRound()', 'Play again');
  } else if (passed) {
    title = `Stage ${stageNum} passed!`;
    info = `<p class="rule-intro">Next: Stage ${compStage + 1} of ${COMP_STAGES.length}${compStage === COMP_STAGES.length - 1 ? ' – all words, mixed' : ''}</p>`;
    buttons = btn('compRoundBtn', 'startCompRound()', 'Next stage ➔');
  } else {
    title = `Stage ${stageNum}: not passed yet`;
    buttons = btn('compRoundBtn', 'startCompRound()', 'Repeat stage');
    if (compFails >= COMP_MAX_FAILS && !isLast) {
      buttons += btn('compSkipBtn', 'skipCompStage()', 'Next stage ➔', 'background: var(--warning);');
    }
  }

  document.getElementById('appWorkspace').innerHTML = `
    <div>
      ${topBar}
      <div class="rule-card" style="text-align: center;">
        <h2>${title}</h2>
        <p class="rule-intro">Score: <strong>${roundFirstOk}/${roundSize}</strong> at the first try (needed: ${need})</p>
        ${info}
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">${buttons}</div>
      </div>
    </div>`;
  document.getElementById('compRoundBtn').focus();
}

function compSupNorm(s) {
  return normalize(s).replace(/^the /, '');
}

/* Case and extra spaces are ignored; "the" in the superlative is optional */
function compFieldOk(which, value) {
  return which === 'comp'
    ? normalize(value) === normalize(currentItem.comp)
    : compSupNorm(value) === compSupNorm(currentItem.sup);
}

function compRetypeDone() {
  return compFieldOk('comp', document.getElementById('compInput').value) &&
         compFieldOk('sup', document.getElementById('supInput').value);
}

function renderComparisonCard() {
  compRetype = false;
  const field = (id, label) => `
        <div class="comp-step">
          <label class="comp-step-title" for="${id}">${label}</label>
          <input type="text" class="typing-input" id="${id}" placeholder="${label}..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>`;

  document.getElementById('appWorkspace').innerHTML = `
    <div>
      ${compTopBar()}
      <div class="prompt-box">
        ${fromLastBadge()}
        <div class="prompt-label">Adjective Comparison</div>
        <div class="prompt-content">${esc(currentItem.base)} ${speakBtn(currentItem.base)}</div>
      </div>
      <div class="comp-builder">
        ${field('compInput', 'Comparative')}
        ${field('supInput', 'Superlative')}
        <div class="rule-note" id="compNote" hidden></div>
      </div>
    </div>
    <div class="feedback-banner" id="compBanner">
      <span>Type both forms. Enter = next field, then check</span>
      <button class="action-btn" id="verifyCompBtn" onclick="verifyComparisons()">Check</button>
    </div>`;

  const ci = document.getElementById('compInput');
  const si = document.getElementById('supInput');
  ci.focus();
  ci.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    e.stopPropagation();
    if (ci.disabled) return;
    if (compRetype && compRetypeDone()) runNextCard();
    else si.focus();
  });
  si.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    e.stopPropagation();
    if (si.disabled) return;
    if (!compRetype) { verifyComparisons(); return; }
    if (compRetypeDone()) runNextCard();
    else if (!compFieldOk('comp', ci.value)) ci.focus();
  });
  [ci, si].forEach(el => el.addEventListener('input', () => { if (compRetype) updateCompRetype(); }));
}

function verifyComparisons() {
  if (compRetype) return;
  const ci = document.getElementById('compInput');
  const si = document.getElementById('supInput');
  const comp = ci.value.trim();
  const sup = si.value.trim();
  if (!comp) { ci.focus(); return; }
  if (!sup) { si.focus(); return; }

  const ok = compFieldOk('comp', comp) && compFieldOk('sup', sup);
  const why = compWordRule(currentItem)[1];
  const forms = compFormsHTML(currentItem);
  speakUK(`${currentItem.base}, ${currentItem.comp}, ${currentItem.sup}`);
  trackAnswer(currentItem.base, `${comp} / ${sup}`, `${currentItem.comp} / ${currentItem.sup}`, ok);
  strictOutcome(ok, currentItem.base, `${currentItem.comp} | ${currentItem.sup}`);

  const note = document.getElementById('compNote');
  note.innerHTML = `${forms[0]} / ${forms[1]}${why ? `<br><span class="rule-why">${esc(why)}</span>` : ''}`;
  note.className = 'rule-note' + (ok ? ' ok' : '');
  note.hidden = false;

  if (ok) {
    [ci, si].forEach(el => { el.disabled = true; el.classList.add('correct'); });
    showResult('compBanner', true, 'All correct!');
  } else {
    compRetype = true;
    [ci, si].forEach(el => { el.value = ''; el.classList.add('incorrect'); });
    showRetype('compBanner', 'Not quite. Type both correct forms to continue.');
    ci.focus();
  }
}

/* Re-typing after a mistake: not sent to the sheet, not counted */
function updateCompRetype() {
  const ci = document.getElementById('compInput');
  const si = document.getElementById('supInput');
  const okC = compFieldOk('comp', ci.value);
  const okS = compFieldOk('sup', si.value);
  ci.classList.toggle('correct', okC);
  ci.classList.toggle('incorrect', !okC);
  si.classList.toggle('correct', okS);
  si.classList.toggle('incorrect', !okS);
  const next = document.getElementById('nextBtn');
  if (next) next.disabled = !(okC && okS);
}

/* ==========================================================================
   MODES 3-4: ADVERBS, MINE/YOURS (type-in, see SHARED TYPE-IN FLOW)
   ========================================================================== */
function renderGrammarCard() {
  const isAdverb = currentMode === 'adverbs';
  const label = isAdverb ? 'Adjective ➔ Adverb' : 'Possessive Pronoun';
  const title = isAdverb ? currentItem.adj : currentItem.phrase;
  const sub = isAdverb ? 'How does an action happen?' : currentItem.de;
  currentAnswer = isAdverb ? currentItem.adv : currentItem.target;

  document.getElementById('appWorkspace').innerHTML = `
    <div>
      <div class="prompt-box">
        ${fromLastBadge()}
        <div class="prompt-label">${label}</div>
        <div class="prompt-content">${esc(title)} ${speakBtn(title)}</div>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;">${esc(sub)}</p>
      </div>
      ${typingBoxHTML()}
    </div>
    <div class="feedback-banner" id="fbBanner"><span>Type the answer and press Enter</span></div>`;
  bindTypeInput();
}

/* ==========================================================================
   MODE 5: SENTENCE COMPLETION (Collocations)
   ========================================================================== */
function renderCollocationCard() {
  currentAnswer = currentItem.target;
  const options = shuffle([currentItem.target, ...currentItem.traps]);

  document.getElementById('appWorkspace').innerHTML = `
    <div>
      <div class="prompt-box">
        <div class="prompt-label">Complete the Sentence</div>
        <div class="prompt-content">${esc(currentItem.stem)} ...</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin: 0 auto 20px;" id="collocGrid">
        ${options.map(opt => `<button class="opt-btn" data-val="${esc(opt)}" onclick="checkCollocChoice(this)">... ${esc(opt)}</button>`).join('')}
      </div>
    </div>
    <div class="feedback-banner" id="collocBanner"><span>Choose the best ending</span></div>`;
}

function checkCollocChoice(btn) {
  const isCorrect = btn.dataset.val === currentAnswer;
  document.getElementById('collocGrid').querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (!isCorrect && b.dataset.val === currentAnswer) b.classList.add('correct');
  });
  btn.classList.add(isCorrect ? 'correct' : 'incorrect');
  speakUK(currentItem.stem + ' ' + currentAnswer);
  trackAnswer(currentItem.stem, btn.dataset.val, currentAnswer, isCorrect);

  if (isCorrect) {
    record(true);
    showResult('collocBanner', true, 'Correct!');
  } else {
    logMistake(currentItem.stem, currentAnswer, currentItem);
    retryQueue.push(currentItem);
    record(false);
    showResult('collocBanner', false, `Answer: <strong>${esc(currentAnswer)}</strong>`);
  }
}

/* ==========================================================================
   COMPLETION SCREEN
   ========================================================================== */
function renderCompletionScreen() {
  trackSessionEnd('completed', false);
  const ws = document.getElementById('appWorkspace');
  let reportHTML = '';
  if (missedLog.length === 0) {
    reportHTML = `<p style="color: var(--success); font-weight: 600; margin: 16px 0;">No mistakes in this session!</p>`;
  } else {
    reportHTML = `
      <div style="margin: 18px 0; text-align: left;">
        <h3 style="font-size: 15px; margin-bottom: 8px; color: var(--warning);">Words to review:</h3>
        <div class="report-wrap">
          <table class="report-table">
            <thead><tr><th>Prompt</th><th>Answer</th><th>Mistakes</th></tr></thead>
            <tbody>
              ${missedLog.map(m => `
                <tr>
                  <td style="font-weight: 600;">${esc(m.key)}</td>
                  <td style="color: var(--accent);">${esc(m.answer)}</td>
                  <td style="color: var(--danger); font-weight: 700;">${m.attempts}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  ws.innerHTML = `
    <div style="text-align: center; margin: auto; max-width: 640px; width: 100%;">
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">Session Finished</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Accuracy: <strong>${document.getElementById('accuracyVal').innerText}</strong></p>
      ${reportHTML}
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px;">
        <button class="action-btn" id="restartBtn" onclick="initSession(false)">Restart Full Session</button>
        ${missedLog.length > 0 ? `<button class="action-btn" style="background: var(--warning);" onclick="initSession(true)">Practise Only ${missedLog.length} Missed Items</button>` : ''}
      </div>
    </div>`;
  document.getElementById('restartBtn').focus();
}

applyStudentMode();
initSession();
</script>
