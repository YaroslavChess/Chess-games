      '<ellipse cx="32" cy="39" rx="4.5" ry="3.2" fill="#0c0a08"/><path d="M28 46q4 3 8 0" fill="none" stroke="#0c0a08" stroke-width="2" stroke-linecap="round"/></svg>',
    fox: '<svg viewBox="0 0 64 64">' + FOX_PARTS + '</svg>',
    teacher: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#3a3025"/><circle cx="32" cy="25" r="11" fill="#f0cf8f"/>' +
      '<path d="M12 56c2-12 10-18 20-18s18 6 20 18" fill="#f0cf8f"/><rect x="26" y="40" width="12" height="4" rx="2" fill="#c96a4d"/></svg>',
    student: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#f0cf8f"/><circle cx="32" cy="27" r="10" fill="#c96a4d"/>' +
      '<path d="M15 56c2-10 9-15 17-15s15 5 17 15" fill="#c96a4d"/></svg>'
  };

  /* ================== ДОПОМІЖНЕ ================== */

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html) e.innerHTML = html;
    return e;
  }
  function later(fn, ms) { return window.setTimeout(fn, ms); }

  /* ================== ПРОГРЕС (localStorage) ================== */
  // Зберігаються зірочки рівнів, медалі за Лисичку, «усі рівні відкрито». Звук вимикається окремо (shared/sound.js).
  // Старі збереження (без поля medals) читаються як є: зірочки лишаються, медалей ще немає.

  function blankProgress() {
    var stars = [], medals = [];
    for (var i = 0; i < LEVEL_COUNT; i++) { stars.push(0); medals.push(false); }
    return { stars: stars, medals: medals, all: false };
  }

  function loadProgress() {
    var p = blankProgress();
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        for (var i = 0; i < LEVEL_COUNT; i++) {
          var s = d.stars && d.stars[i];
          p.stars[i] = (typeof s === 'number' && s >= 0 && s <= 3) ? s : 0;
          p.medals[i] = !!(d.medals && d.medals[i] === true);
        }
        p.all = d.all === true;
      }
    } catch (e) { /* сховище недоступне — граємо без збереження */ }
    return p;
  }

  function saveProgress() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { /* ігноруємо */ }
  }

  var progress = loadProgress();

  function isOpen(level) {
    return progress.all || level === 1 || progress.stars[level - 2] > 0;
  }

  /* ================== ЗВУКИ ================== */
  // Усі звуки — у спільному shared/sound.js (Sound.play). Кнопка 🔊/🔇 — у смужці бренду (theme.js).
  // Якщо файл звуків не завантажився — гра просто мовчить.
  if (!window.Sound) { window.Sound = { play: function () {}, setMuted: function () {}, isMuted: function () { return true; } }; }

  /* ================== ОЗВУЧЕННЯ ПІДКАЗКИ (якщо є український голос) ================== */

  var ukVoice = null;
  function findVoice() {
    if (!window.speechSynthesis) return;
    var vs = window.speechSynthesis.getVoices();
    ukVoice = null;
    for (var i = 0; i < vs.length; i++) {
      if (/^uk/i.test(vs[i].lang)) { ukVoice = vs[i]; break; }
    }
    $('btn-speak').classList.toggle('hidden', !ukVoice);
  }
  function speak(text) {
    if (!ukVoice) return;
    var u = new window.SpeechSynthesisUtterance(text);
    u.voice = ukVoice;
    u.lang = ukVoice.lang;
    u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }

  /* ================== КОНФЕТІ ================== */

  var confetti = { parts: [], running: false };
  // Колір конфеті береться зі змінних :root, щоб збігатися з темою оформлення.
  function cssColor(name) {
    var v = '';
    try { v = getComputedStyle(document.documentElement).getPropertyValue(name); } catch (e) {}
    v = String(v).replace(/^\s+|\s+$/g, '');
    return v || '#d8a94c';
  }
  function launchConfetti(count) {
    var cv = $('confetti');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) count = Math.floor(count / 3);
    cv.classList.remove('hidden');
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
    var colors = [cssColor('--gold'), cssColor('--gold-soft'), cssColor('--green'), cssColor('--green-soft'), cssColor('--danger'), cssColor('--text')];
    for (var i = 0; i < count; i++) {
      confetti.parts.push({
        x: cv.width / 2 + (Math.random() - 0.5) * cv.width * 0.3,
        y: cv.height * 0.45,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 15 - 5,
        r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.4,
        w: 7 + Math.random() * 7,
        h: 4 + Math.random() * 5,
        c: colors[i % colors.length],
        life: 0
      });
    }
    if (!confetti.running) {
      confetti.running = true;
      window.requestAnimationFrame(confettiFrame);
    }
  }
  function stopConfetti() {
    confetti.parts = [];
  }
  function confettiFrame() {
    var cv = $('confetti'), ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    var alive = [];
    for (var i = 0; i < confetti.parts.length; i++) {
      var p = confetti.parts[i];
      p.vy += 0.35;
      p.vx *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.r += p.vr;
      p.life++;
      if (p.y < cv.height + 20 && p.life < 240) alive.push(p);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life / 6)));
      ctx.restore();
    }
    confetti.parts = alive;
    if (alive.length) {
      window.requestAnimationFrame(confettiFrame);
    } else {
      confetti.running = false;
      cv.classList.add('hidden');
    }
  }

  /* ================== ДОШКА (вигляд) ================== */

  function BoardView(root, onTap) {
    this.root = root;
    this.flip = false;
    this.pieces = {};
    this.squares = [];
    root.innerHTML = '';
    for (var sq = 0; sq < 25; sq++) {
      var s = el(onTap ? 'button' : 'div', 'sq');
      if (onTap) {
        s.type = 'button';
        s.addEventListener('click', makeTap(onTap, sq));
      }
      s.appendChild(el('span', 'dot'));
      root.appendChild(s);
      this.squares.push(s);
    }
    this.layer = el('div', 'pieces');
    root.appendChild(this.layer);
    this.layout();
  }
  function makeTap(fn, sq) { return function () { fn(sq); }; }

  BoardView.prototype.cell = function (sq) {
    var f = sq % 5, r = (sq - f) / 5;
    return this.flip ? { col: 4 - f, row: r } : { col: f, row: 4 - r };
  };
  BoardView.prototype.layout = function () {
    for (var sq = 0; sq < 25; sq++) {
      var c = this.cell(sq), s = this.squares[sq], f = sq % 5, r = (sq - f) / 5;
      s.style.left = (c.col * 20) + '%';
      s.style.top = (c.row * 20) + '%';
      s.className = 'sq' + ((f + r) % 2 === 0 ? ' dark' : '');
    }
  };
  BoardView.prototype.place = function (wrap, sq) {
    var c = this.cell(sq);
    wrap.style.transform = 'translate(' + (c.col * 100) + '%,' + (c.row * 100) + '%)';
  };
  // Розставити фігури. fx: instant — без анімації; jumpId — стрибок.
  BoardView.prototype.sync = function (board, fx) {
    fx = fx || {};
    var seen = {}, sq, id;
    if (fx.instant) this.layer.className = 'pieces no-anim';
    for (sq = 0; sq < 25; sq++) {
      var p = board[sq];
      if (!p) continue;
      seen[p.id] = true;
      var w = this.pieces[p.id], key = p.c + p.t;
      if (!w) {
        w = el('div', 'pc-wrap appear', '<div class="pc-in">' + pieceSvg(p.t, p.c) + '</div>');
        w.setAttribute('data-k', key);
        this.pieces[p.id] = w;
        this.place(w, sq);
        this.layer.appendChild(w);
      } else if (w.getAttribute('data-k') !== key) {
        w.setAttribute('data-k', key);
        w.firstChild.innerHTML = pieceSvg(p.t, p.c);
        restartClass(w, 'morph');
      }
      w.classList.remove('jump');
      if (fx.jumpId === p.id) restartClass(w, 'jump');
      this.place(w, sq);
    }
    for (id in this.pieces) {
      if (!this.pieces.hasOwnProperty(id) || seen[id]) continue;
      var gone = this.pieces[id];
      delete this.pieces[id];
      if (fx.instant) { this.layer.removeChild(gone); continue; }
      gone.classList.add('captured');
      removeLater(gone, 350);
    }
    if (fx.instant) {
      void this.layer.offsetWidth;
      this.layer.className = 'pieces';
    }
    function removeLater(w3, ms) {
      later(function () { if (w3.parentNode) w3.parentNode.removeChild(w3); }, ms);
    }
  };
  BoardView.prototype.pieceEl = function (id) { return this.pieces[id] || null; };
  // Підсвітити ряд, де пішаки програють для білих (1-й ряд): у рівнях 2–5 пішак, що дійшов
  // туди, — програш. Клітинки 1-го ряду мають індекси 0..4 незалежно від переворота дошки.
  BoardView.prototype.finishRow = function (on) {
    for (var sq = 0; sq < 5; sq++) this.squares[sq].classList.toggle('finish', !!on);
  };
  // Позначки: sel — вибрана клітинка, moves — ходи, foe — ходи «не для гри», last, check.
  BoardView.prototype.marks = function (m) {
    m = m || {};
    var marks = {}, i;
    if (m.moves) {
      for (i = 0; i < m.moves.length; i++) marks[m.moves[i].to] = m.moves[i].capture ? 'cap' : 'mv';
    }
    for (var sq = 0; sq < 25; sq++) {
      var s = this.squares[sq];
      s.classList.toggle('sel', m.sel === sq);
      s.classList.toggle('mv', marks[sq] === 'mv');
      s.classList.toggle('cap', marks[sq] === 'cap');
      s.classList.toggle('foe', !!m.foe && !!marks[sq]);
      s.classList.toggle('last', !!m.last && (m.last.from === sq || m.last.to === sq));
      s.classList.toggle('check', m.check === sq);
    }
    for (var id in this.pieces) {
      if (this.pieces.hasOwnProperty(id)) this.pieces[id].classList.remove('sel');
    }
  };
  BoardView.prototype.label = function (board) {
    for (var sq = 0; sq < 25; sq++) {
      var p = board[sq];
      this.squares[sq].setAttribute('aria-label', MC.sqName(sq) + (p ? ', ' + (p.c === 'w' ? 'білі' : 'чорні') + ': ' + PIECE_NAMES[p.t] : ''));
    }
  };

  function restartClass(node, cls) {
    node.classList.remove(cls);
    void node.offsetWidth;
    node.classList.add(cls);
  }

  /* ================== ЕКРАНИ ================== */

  var SCREENS = ['map', 'intro', 'game', 'join', 'teacher'];
  var current = 'map';
  function show(name) {
    for (var i = 0; i < SCREENS.length; i++) $('scr-' + SCREENS[i]).classList.toggle('hidden', SCREENS[i] !== name);
    current = name;
    $('wrap').classList.toggle('wrap-game', name === 'game');
    stopConfetti();
    $('btn-home').classList.toggle('hidden', name === 'map');
    if (name !== 'intro') stopDemo();
    window.scrollTo(0, 0);
  }

  function goHome() {
    $('top-title').textContent = 'Міні-шахи';
    stopGame();
    netClose();
    forgetRoom();
    hideOverlay('result');
    renderMap();
    show('map');
  }

  /* ---------- Карта ---------- */

  function renderMap() {
    var box = $('levels');
    box.innerHTML = '';
    var nextMarked = false;
    for (var lv = 1; lv <= LEVEL_COUNT; lv++) {
      var info = LEVEL_INFO[lv - 1], open = isOpen(lv), st = progress.stars[lv - 1];
      var t = el('button', 'tile' + (open ? '' : ' locked'));
      t.type = 'button';
      var pic = info.piece === 'all' ? pieceSvg('k', 'w') + pieceSvg('q', 'b') : pieceSvg(info.piece, 'w');
      var stars = '';
      for (var i = 1; i <= 3; i++) stars += starSvg(st >= i);
      stars += medalSvg(progress.medals[lv - 1]);
      t.innerHTML = '<span class="num">' + lv + '</span><span class="pic">' + pic + '</span>' +
        '<span class="name">' + info.name + '</span><span class="stars">' + stars + '</span>' +
        (open ? '' : '<span class="lock">' + ICONS.lockBig + '</span>');
      t.setAttribute('aria-label', 'Рівень ' + lv + ': ' + info.name + (open ? ', зірочок: ' + st + (progress.medals[lv - 1] ? ', є медаль за Лисичку' : '') : ', закрито'));
      if (open && !st && !nextMarked) { t.className += ' next'; nextMarked = true; }
      t.addEventListener('click', makeLevelTap(lv, t));
      box.appendChild(t);
    }
  }
  function makeLevelTap(lv, tile) {
    return function () {
      if (!isOpen(lv)) {
        Sound.play('wrong');
        restartClass(tile, 'shake');
        return;
      }
      openIntro(lv);
    };
  }

  /* ---------- Підказка рівня ---------- */

  var intro = { level: 1, real: false };
  var hintView = null;
  var demoTimer = null;

  function openIntro(lv) {
    intro.level = lv;
    intro.real = false;
    $('intro-title').textContent = 'Рівень ' + lv + ': ' + LEVEL_INFO[lv - 1].name;
    $('rules-toggle').classList.toggle('hidden', lv !== LEVEL_COUNT);
    show('intro');
    renderIntro();
  }

  function renderIntro() {
    var info = LEVEL_INFO[intro.level - 1], real = intro.real && info.hintReal;
    $('hint-text').textContent = real ? info.hintReal : info.hint;
    $('intro-goal').innerHTML = ICONS.target + '<span></span>';
    $('intro-goal').lastChild.textContent = real ? info.goalReal : info.goal;
    setRadio($('rules-toggle'), intro.real ? '1' : '0');
    startDemo(real ? info.demoReal : info.demo, real ? MC.createGame(LEVEL_COUNT, true).rules : MC.LEVELS[intro.level - 1].rules);
  }

  function setRadio(group, val) {
    var bs = group.getElementsByTagName('button');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-checked', bs[i].getAttribute('data-real') === val ? 'true' : 'false');
  }

  function startDemo(d, rules) {
    stopDemo();
    if (!hintView) hintView = new BoardView($('hint-board'), null);
    var board = MC.parse(d.setup), hero = MC.sqIndex(d.hero), seg = 0;
    var moves = MC.movesFrom({ board: board, rules: rules }, hero);
    hintView.sync(board, { instant: true });
    hintView.marks({ sel: hero, moves: moves });
    function step() {
      var to = MC.sqIndex(d.path[seg % d.path.length]), b2 = board.slice();
      b2[to] = b2[hero];
      b2[hero] = null;
      hintView.sync(b2, { jumpId: d.jump ? b2[to].id : null });
      hintView.marks({ sel: to, check: d.check ? MC.sqIndex(d.check) : -1 });
      demoTimer = later(function () {
        hintView.sync(board, { instant: true });
        hintView.marks({ sel: hero, moves: moves });
        seg++;
        demoTimer = later(step, 700);
      }, 1500);
    }
    demoTimer = later(step, 900);
  }
  function stopDemo() {
    if (demoTimer) window.clearTimeout(demoTimer);
    demoTimer = null;
  }

  /* ================== ГРА ================== */

  var G = {
    mode: 'bot',          // bot | online
    role: 'bot',          // bot | teacher | student
    level: 1,
    real: false,
    opponent: 'bear',     // bear | fox | teacher (з погляду учня) або student (з погляду вчителя)
    me: 'w',
    state: null,
    sel: -1,
    busy: false,
    moves: [],            // [[from, to], ...] — для синхронізації онлайн
    start: null,          // позиція до першого ходу
    hist: [],             // [{ san, state }] — запис ходу й позиція після нього
    view: null,           // null — поточна гра; число — скільки півходів показано в історії
    taken: { w: [], b: [] },  // що з'їв кожен колір
    gameNo: 0,
    timers: []
  };
  var view = null;
  var boardUI = null;      // перетягування й стрілки (shared/board-ui.js)

  function gameLater(fn, ms) { G.timers.push(later(fn, ms)); }
  function clearGameTimers() {
    for (var i = 0; i < G.timers.length; i++) window.clearTimeout(G.timers[i]);
    G.timers = [];
  }

  function stopGame() {
    clearGameTimers();
    G.state = null;
    G.busy = false;
  }

  // Дошка 5×5: клітинок по 5 (не 8). Переворот дошки (view.flip) враховують лише squareFromPoint і squareRect.
  // Якщо файл модуля не завантажився (window.BoardUI немає) — працює тап-тап, як раніше.
  function attachBoardUI() {
    if (!window.BoardUI || boardUI) return;
    boardUI = BoardUI.attach($('board'), {
      // Яка клітинка ('a1'..'e5') під точкою екрана (x, y) — або null, якщо точка поза дошкою.
      squareFromPoint: function (x, y) {
        var r = $('board').getBoundingClientRect();
        if (!r.width || x < r.left || y < r.top || x >= r.right || y >= r.bottom) return null;
        var col = Math.floor((x - r.left) / r.width * 5);
        var row = Math.floor((y - r.top) / r.height * 5);
        var f = view.flip ? 4 - col : col;
        var rk = view.flip ? row : 4 - row;
        return MC.sqName(rk * 5 + f);
      },
      // Де на екрані клітинка.
      squareRect: function (name) {
        var s = view.squares[MC.sqIndex(name)];
        return s ? s.getBoundingClientRect() : null;
      },
      isFlipped: function () { return !!view.flip; },
      // Елемент фігури — модуль покаже його копію під пальцем.
      pieceElement: function (name) {
        var p = G.state && G.state.board[MC.sqIndex(name)];
        return p ? view.pieceEl(p.id) : null;
      },
      // Тягнути можна лише свою фігуру і лише у свій хід.
      canDrag: function (name) {
        var sq = MC.sqIndex(name);
        if (!myTurn()) return false;
        var p = G.state.board[sq];
        return !!p && p.c === G.me && MC.movesFrom(G.state, sq).length > 0;
      },
      legalTargets: function (from) {
        var ms = MC.movesFrom(G.state, MC.sqIndex(from)), out = [];
        for (var i = 0; i < ms.length; i++) out.push(MC.sqName(ms[i].to));
        return out;
      },
      // Почали тягнути — показуємо крапки ходів, як після тапу.
      onDragStart: function (name) {
        var sq = MC.sqIndex(name);
        if (G.sel !== sq) {
          G.sel = sq;
          renderMarks();
        }
      },
      onDrop: function (from, to) {
        if (!myTurn()) return;
        var m = MC.findMove(G.state, MC.sqIndex(from), MC.sqIndex(to));
        if (m) {
          G.sel = -1;
          playMove(m, false, true);
        }
      },
      tools: $('boardTools')
    });
  }

  function startGame(level, opts) {
    clearGameTimers();
    hideOverlay('result');
    G.mode = opts.mode;
    G.role = opts.role || 'bot';
    G.level = level;
    G.real = !!opts.real;
    G.opponent = opts.opponent;
    G.me = opts.me || 'w';
    G.state = MC.createGame(level, G.real);
    G.sel = -1;
    G.busy = false;
    G.moves = [];
    G.start = G.state;
    G.hist = [];
    G.view = null;
    $('pgn-box').classList.add('hidden');
    $('moves-msg').textContent = '';
    G.taken = { w: [], b: [] };
    if (!view) view = new BoardView($('board'), onSquare);
    attachBoardUI();
    if (boardUI) { boardUI.cancel(); boardUI.clearShapes(); }
    view.flip = G.me === 'b';
    view.layout();
    if (boardUI) boardUI.redraw();
    view.finishRow(level >= 2 && level <= 5);
    var replay = opts.moves || [];
    for (var i = 0; i < replay.length; i++) {
      var m = MC.findMove(G.state, replay[i][0], replay[i][1]);
      if (!m) break;
      record(m);
    }
    view.sync(G.state.board, { instant: true });
    var info = LEVEL_INFO[level - 1];
    $('goal-line').textContent = (G.real && info.goalReal) ? info.goalReal : info.goal;
    $('top-title').textContent = 'Рівень ' + level;
    $('room').classList.toggle('hidden', G.mode !== 'online');
    $('btn-restart').classList.toggle('hidden', G.role === 'student');
    $('link-box').classList.toggle('hidden', G.role !== 'teacher');
    show('game');
    refresh();
    if (G.state.over) gameLater(showResult, 300);
  }

  function record(m) {
    var before = G.state;
    var san = MC.san(before, m);
    G.state = MC.applyMove(before, m);
    G.moves.push([m.from, m.to]);
    G.hist.push({ san: san, state: G.state });
    var last = G.state.last;
    if (last.captured) G.taken[last.piece.c].push(last.captured.t);
    return G.state;
  }

  function myTurn() {
    return G.state && !G.state.over && !G.busy && G.view === null && G.state.turn === G.me;
  }

  function onSquare(sq) {
    if (!G.state) return;
    var s = G.state;
    if (G.sel >= 0 && myTurn() && s.board[G.sel] && s.board[G.sel].c === G.me) {
      var m = MC.findMove(s, G.sel, sq);
      if (m) {
        G.sel = -1;
        playMove(m, false);
        return;
      }
    }
    G.sel = (s.board[sq] && sq !== G.sel) ? sq : -1;
    renderMarks();
  }

  // dropped: фігуру перетягнули, вона вже стоїть на новій клітинці — показуємо хід без анімації.
  function playMove(m, fromNet, dropped) {
    if (boardUI) boardUI.clearShapes();
    var mover = G.state.board[m.from];
    var ns = record(m);
    var last = ns.last;
    G.sel = -1;
    G.busy = true;
    if (G.mode === 'online') {
      saveRoom();
      if (!fromNet) sendState();
    }

    var viewing = G.view !== null;   // дивимось історію: дошку не чіпаємо, у списку лише додається хід
    Sound.play(last.capture ? 'capture' : 'move');
    if (MC.inCheck(ns.board, ns.turn)) setTimeout(function () { Sound.play('check'); }, 220);
    if (!viewing) {
      view.sync(ns.board, {
        jumpId: mover.t === 'n' ? mover.id : null,
        instant: !!dropped
      });
    }
    refresh();

    var wait = 350;
    if (m.promo && !viewing) {
      // Пішак дійшов до останнього ряду: сяйво, конфеті, а в рівні 7 — перетворення на ферзя.
      wait = 1200;
      var mine = mover.c === G.me;
      gameLater(function () {
        var w = view.pieceEl(mover.id);
        if (w) restartClass(w, 'glow');
        if (mine) {
          Sound.play('star');
          launchConfetti(90);
        }
      }, 300);
    }
    gameLater(afterMove, wait);
  }

  function afterMove() {
    G.busy = false;
    if (!G.state) return;
    if (G.state.over) {
      if (G.view !== null) { setView(null); }
      refresh();
      gameLater(showResult, 600);
      return;
    }
    refresh();
    if (G.mode === 'bot' && G.state.turn !== G.me) {
      G.busy = true;
      refresh();
      gameLater(botMove, Math.max(0, BOT_DELAY - 350));
    }
  }

  function botMove() {
    if (!G.state || G.state.over) return;
    var m = G.opponent === 'fox' ? MC.botFox(G.state) : MC.botBear(G.state);
    G.busy = false;
    if (m) playMove(m, false);
  }

  function refresh() {
    renderMarks();
    renderStatus();
    renderTrays();
    view.label(shownState().board);
    renderMoves();
  }

  /* ---------- Запис ходів ---------- */

  // Позиція, яку зараз видно на дошці: з історії (якщо дивимось ходи) або поточна.
  function shownState() {
    if (G.view === null) return G.state;
    return G.view === 0 ? G.start : G.hist[G.view - 1].state;
  }

  function shownPly() { return G.view === null ? G.hist.length : G.view; }

  // Підпис ходу: «3. Nf3» для білих, «3... Nc6» для чорних.
  function moveLabel(ply) {
    return Math.ceil(ply / 2) + (ply % 2 === 1 ? '. ' : '... ') + G.hist[ply - 1].san;
  }

  // Показати позицію після ply-го півходу (null або останній — повернутися в поточну гру).
  function setView(ply) {
    if (!G.state || !view) return;
    if (ply !== null && ply >= G.hist.length) ply = null;
    if (ply !== null && ply < 0) ply = 0;
    if (ply === G.view) return;
    G.view = ply;
    G.sel = -1;
    if (boardUI) { boardUI.cancel(); boardUI.clearShapes(); }
    view.sync(shownState().board, { instant: true });
    refresh();
  }

  function moveButton(san, ply, now) {
    return '<button type="button" class="mv' + (ply === now ? ' now' : '') + '" data-ply="' + ply + '"' +
      (ply === now ? ' aria-current="true"' : '') + '>' + san + '</button>';
  }

  function renderMoves() {
    var list = $('moves-list');
    if (!G.state) return;
    var now = shownPly(), html = '', i, cur, top, bottom;
    if (!G.hist.length) html = '<span class="moves-empty">Ходів ще немає</span>';
    for (i = 0; i < G.hist.length; i += 2) {
      html += '<span class="mv-pair"><span class="mv-num">' + (i / 2 + 1) + '.</span>' + moveButton(G.hist[i].san, i + 1, now);
      if (i + 1 < G.hist.length) html += moveButton(G.hist[i + 1].san, i + 2, now);
      html += '</span>';
    }
    list.innerHTML = html;
    if (G.view === null) {
      list.scrollTop = list.scrollHeight;
    } else {
      cur = list.querySelector('.now');
      if (cur) {
        top = cur.offsetTop;
        bottom = top + cur.offsetHeight;
        if (top < list.scrollTop) list.scrollTop = top - 4;
        else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight + 4;
      }
    }
    $('mv-prev').disabled = (now === 0);
    $('mv-next').disabled = (G.view === null);
    $('mv-live').disabled = (G.view === null);
    $('btn-pgn').disabled = !G.hist.length;
  }

  function onMovesClick(e) {
    var node = e.target;
    while (node && node !== $('moves-list')) {
      if (node.getAttribute && node.getAttribute('data-ply')) {
        setView(parseInt(node.getAttribute('data-ply'), 10));
        return;
      }
      node = node.parentNode;
    }
  }

  // Стрілки ← → (і Home/End) гортають ходи, поки відкрита гра.
  function onMovesKey(e) {
    var tag = e.target && e.target.tagName, key = e.key;
    if (current !== 'game' || !G.state) return;
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (document.querySelector('.overlay:not(.hidden)')) return;
    if (key === 'ArrowLeft') { e.preventDefault(); if (shownPly() > 0) setView(shownPly() - 1); }
    else if (key === 'ArrowRight') { e.preventDefault(); if (G.view !== null) setView(G.view + 1); }
    else if (key === 'Home') { e.preventDefault(); setView(0); }
    else if (key === 'End') { e.preventDefault(); setView(null); }
  }

  function playerName(color) {
    if (color === G.me) return G.role === 'teacher' ? 'Вчитель' : 'Учень';
    return opponentName();
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // Партія у форматі PGN. Дошка 5×5, тому в тегах є Variant і початкова позиція (FEN у стилі гри).
  function buildPgn() {
    var now = new Date(), result = '*', parts = [], i;
    var o = G.state.over ? G.state : null;
    if (o) result = o.winner === 'w' ? '1-0' : (o.winner === 'b' ? '0-1' : '1/2-1/2');
    for (i = 0; i < G.hist.length; i++) {
      parts.push(i % 2 === 0 ? (i / 2 + 1) + '. ' + G.hist[i].san : G.hist[i].san);
    }
    parts.push(result);
    return '[Event "Міні-шахи, рівень ' + G.level + '"]\n' +
      '[Date "' + now.getFullYear() + '.' + pad2(now.getMonth() + 1) + '.' + pad2(now.getDate()) + '"]\n' +
      '[White "' + playerName('w') + '"]\n' +
      '[Black "' + playerName('b') + '"]\n' +
      '[Result "' + result + '"]\n' +
      '[Variant "Mini 5x5"]\n' +
      '[SetUp "1"]\n' +
      '[FEN "' + MC.LEVELS[G.level - 1].setup + ' w - - 0 1"]\n\n' + parts.join(' ') + '\n';
  }

  function copyPgn() {
    var text = buildPgn(), box = $('pgn-box'), msg = $('moves-msg');
    function done() {
      box.classList.add('hidden');
      msg.textContent = 'PGN скопійовано!';
    }
    function byHand() {
      box.value = text;
      box.classList.remove('hidden');
      box.focus();
      box.select();
      try {
        if (document.execCommand('copy')) { done(); return; }
      } catch (e) { /* немає доступу до буфера */ }
      msg.textContent = 'Виділи текст і скопіюй його вручну.';
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, byHand);
        return;
      }
    } catch (e) { /* спробуємо інакше */ }
    byHand();
  }

  function renderMarks() {
    if (!G.state || !view) return;
    var s = shownState(), m = { last: s.last, check: -1 };
    if (G.sel >= 0 && s.board[G.sel]) {
      var p = s.board[G.sel];
      m.sel = G.sel;
      m.moves = MC.movesFrom(s, G.sel);
      m.foe = !(p.c === G.me && s.turn === G.me && !s.over);
      var w = view.pieceEl(p.id);
      if (w) w.classList.add('sel');
    }
    if (s.rules.king || s.rules.mate) {
      for (var i = 0; i < 2; i++) {
        var c = i ? 'b' : 'w';
        if (MC.inCheck(s.board, c)) m.check = MC.kingSquare(s.board, c);
      }
    }
    view.marks(m);
    if (m.sel >= 0) {
      var w2 = view.pieceEl(s.board[m.sel].id);
      if (w2) w2.classList.add('sel');
    }
  }

  function opponentName() {
    if (G.opponent === 'fox') return 'Лисичка';
    if (G.opponent === 'bear') return 'Ведмедик';
    if (G.opponent === 'teacher') return 'Вчитель';
    return 'Учень';
  }

  function renderStatus() {
    var s = G.state, box = $('status'), txt, ava;
    var foeAva = AVATARS[G.opponent] || AVATARS.student;
    var mineAva = pieceSvg('p', G.me);
    if (G.view !== null) {
      txt = G.view === 0 ? 'Перегляд: початок' : 'Перегляд: ' + moveLabel(G.view);
      ava = mineAva;
    } else if (s.over) {
      txt = 'Гру закінчено';
      ava = s.winner === G.me ? mineAva : foeAva;
    } else if (myTurn()) {
      txt = 'Твій хід';
      ava = mineAva;
    } else {
      // Хід суперника або ще анімується його хід.
      txt = opponentName() + (G.mode === 'bot' ? ' думає' : ' ходить');
      ava = foeAva;
    }
    box.classList.toggle('my-turn', myTurn());
    $('status-ava').innerHTML = ava;
    $('status-txt').innerHTML = '';
    $('status-txt').appendChild(document.createTextNode(txt));
    if (!s.over && !myTurn()) $('status-txt').appendChild(el('span', 'thinking', '<i></i><i></i><i></i>'));
  }

  function trayHtml(list, color) {
    var h = '';
    for (var i = 0; i < list.length; i++) h += pieceSvg(list[i], color);
    return h;
  }

  function renderTrays() {
    var s = G.state, foe = MC.other(G.me);
    var top = $('tray-top'), bottom = $('tray-bottom');
    top.innerHTML = trayHtml(G.taken[foe], G.me);
    bottom.innerHTML = trayHtml(G.taken[G.me], foe);
  }

  /* ---------- Результат ---------- */

  // Підписи зірочок для екрана результату: за що кожна.
  function starLabels(info) {
    var second = info.byLoss
      ? (info.loss === 0 ? 'Без втрат' : 'Мало втрат: не більше ' + info.loss)
      : 'Не довго: не більше ' + info.ok + ' ходів';
    return [
      { text: 'Перемога', on: info.win },
      { text: second, on: info.second },
      { text: 'Швидко: не більше ' + info.fast + ' ходів', on: info.third }
    ];
  }

  function showResult() {
    var s = G.state;
    if (!s || !s.over) return;
    var win = s.winner === G.me, draw = !s.winner;
    var pawnLevel = s.level >= 2 && s.level <= 5;
    var r = (pawnLevel ? PAWN_REASONS[s.reason] : null) || REASONS[s.reason] || {};
    var reason = draw ? (r.d || '') : (win ? r.w : r.l) || '';
    // Зірочки — лише за перемогу білими (рівні складено для білих), не у вчителя.
    var earnsStars = win && G.me === 'w' && G.role !== 'teacher';
    var stars = 0, info = MC.starInfo(s);
    if (earnsStars) {
      stars = info.stars;
      if (stars > progress.stars[G.level - 1]) {
        progress.stars[G.level - 1] = stars;
        saveProgress();
      }
    }
    // Медаль — окрема нагорода за перемогу над Лисичкою (лише проти бота), не зірочка.
    var medal = earnsStars && G.mode === 'bot' && G.opponent === 'fox';
    if (medal && !progress.medals[G.level - 1]) {
      progress.medals[G.level - 1] = true;
      saveProgress();
    }
    var title = draw ? 'Нічия' : win ? 'Перемога!' : 'Спробуй ще раз!';
    if (G.role === 'teacher') title = draw ? 'Нічия' : win ? 'Ви виграли' : 'Учень виграв!';
    $('result-title').textContent = title;
    $('result-reason').textContent = reason;
    $('result-icon').innerHTML = draw ? ICONS.draw : (win || G.role === 'teacher') ? ICONS.trophy : ICONS.hug;
    var starBox = $('result-stars');
    starBox.innerHTML = '';
    if (earnsStars) {
      for (var i = 1; i <= 3; i++) starBox.innerHTML += starSvg(stars >= i);
    }
    starBox.classList.toggle('hidden', !earnsStars);

    var list = $('star-list'), labels = starLabels(info);
    list.innerHTML = '';
    for (var k = 0; k < labels.length; k++) {
      var li = el('li', labels[k].on ? 'got' : '', starSvg(labels[k].on));
      var box = el('span');
      box.appendChild(document.createTextNode(labels[k].text));
      li.appendChild(box);
      list.appendChild(li);
    }
    var note = el('li', 'note');
    note.textContent = 'Твоїх ходів: ' + info.moves;
    list.appendChild(note);
    list.classList.toggle('hidden', !earnsStars);
    var medalBox = $('medal-row');
    medalBox.innerHTML = medal ? medalSvg(true) + '<span>Медаль за перемогу над Лисичкою!</span>' : '';
    medalBox.classList.toggle('hidden', !medal);

    var acts = $('result-actions');
    acts.innerHTML = '';
    if (G.mode === 'bot') {
      if (win && G.level < LEVEL_COUNT) acts.appendChild(actionBtn('btn-primary', ICONS.next, 'Далі', function () {
        hideOverlay('result');
        openIntro(G.level + 1);
      }));
      acts.appendChild(actionBtn(win ? 'btn-secondary' : 'btn-primary', ICONS.retry, 'Ще раз', function () {
        startGame(G.level, { mode: 'bot', real: G.real, opponent: G.opponent });
      }));
    } else if (G.role === 'teacher') {
      acts.appendChild(actionBtn('btn-primary', ICONS.retry, 'Ще раз', teacherNewGame));
    } else {
      acts.appendChild(el('p', 'reason', 'Вчитель може почати нову гру.'));
    }
    acts.appendChild(actionBtn('btn-secondary', ICONS.homeDark, 'Додому', goHome));
    $('result').classList.remove('hidden');

    if (win && G.role !== 'teacher') {
      Sound.play('win');
      if (stars > 0) setTimeout(function () { Sound.play('star'); }, 1100);
      launchConfetti(160);
    } else if (!win && !draw && G.role !== 'teacher') {
      Sound.play('lose');
    }
  }

  function actionBtn(cls, icon, text, fn) {
    var b = el('button', 'btn ' + cls, icon);
    b.type = 'button';
    b.appendChild(document.createTextNode(text));
    b.addEventListener('click', fn);
    return b;
  }
  function hideOverlay(id) { $(id).classList.add('hidden'); }

  /* ================== ВЧИТЕЛЬ: пароль і панель ================== */

  var pinValue = '';
  function buildPad(box, onDigit, onDel) {
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
    box.innerHTML = '';
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (!k) { box.appendChild(el('span')); continue; }
      var b = el('button', '', k === 'del' ? ICONS.del : k);
      b.type = 'button';
      b.setAttribute('aria-label', k === 'del' ? 'Стерти' : k);
      b.addEventListener('click', k === 'del' ? onDel : makeDigit(onDigit, k));
      box.appendChild(b);
    }
  }
  function makeDigit(fn, k) { return function () { fn(k); }; }

  function renderPinDots() {
    var dots = $('pin-dots').getElementsByTagName('i');
    for (var i = 0; i < dots.length; i++) dots[i].className = i < pinValue.length ? 'on' : '';
  }
  function openPin() {
    pinValue = '';
    renderPinDots();
    $('pin').classList.remove('hidden');
  }
  function pinDigit(k) {
    if (pinValue.length >= 4) return;
    pinValue += k;
    renderPinDots();
    if (pinValue.length < 4) return;
    if (pinValue === TEACHER_PIN) {
      later(function () {
        hideOverlay('pin');
        openTeacher();
      }, 150);
    } else {
      Sound.play('wrong');
      restartClass($('pin-dialog'), 'shake');
      later(function () { pinValue = ''; renderPinDots(); }, 400);
    }
  }

  var teacherPick = { level: 1, real: false, side: 'w' };
  function openTeacher() {
    $('top-title').textContent = 'Міні-шахи';
    stopGame();
    netClose();
    forgetRoom();
    renderTeacher();
    show('teacher');
  }
  function renderTeacher() {
    $('btn-unlock-all').textContent = progress.all ? 'Закрити рівні знову' : 'Відкрити всі рівні';
    var box = $('teacher-levels');
    box.innerHTML = '';
    for (var lv = 1; lv <= LEVEL_COUNT; lv++) {
      var b = el('button', '', String(lv));
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', teacherPick.level === lv ? 'true' : 'false');
      b.setAttribute('aria-label', 'Рівень ' + lv + ': ' + LEVEL_INFO[lv - 1].name);
      b.addEventListener('click', makeTeacherLevel(lv));
      box.appendChild(b);
    }
    $('teacher-rules').classList.toggle('hidden', teacherPick.level !== LEVEL_COUNT);
    setRadio($('teacher-rules'), teacherPick.real ? '1' : '0');
    var sb = $('teacher-side').getElementsByTagName('button');
    for (var i = 0; i < sb.length; i++) sb[i].setAttribute('aria-checked', sb[i].getAttribute('data-side') === teacherPick.side ? 'true' : 'false');
    $('teacher-msg').classList.add('hidden');
  }
  function makeTeacherLevel(lv) { return function () { teacherPick.level = lv; renderTeacher(); }; }

  /* ================== ОНЛАЙН (Ably) ================== */
  // Вчитель натискає «Грати онлайн» і надсилає учню посилання ?room=<6 цифр>. Учень відкриває
  // його й одразу грає (код можна ввести й вручну: «Грати з вчителем»). Колір учня обирає вчитель.
  // Протокол каналу mini-chess:<id кімнати>:
  //   hello {}  — хтось зайшов (або повернувся після оновлення) і просить стан;
  //   state {level, real, side, game, moves} — повний стан партії: рівень, правила, колір учня,
  //         номер партії в кімнаті й усі ходи [[звідки, куди], ...]. Надсилається після кожного
  //         ходу, після «Ще раз» і у відповідь на hello. Новіший стан — з більшим game, а при
  //         рівному game — з більшою кількістю ходів. Ходи перевіряються на обох сторонах.
  //   bye   {}  — хтось вийшов.
  // Після оновлення сторінки стан береться з localStorage, з історії каналу Ably й від суперника.

  var Net = { client: null, ch: null, role: '', code: '', helloTimer: null, wasConnected: false };

  function ablyConfigured() {
    return typeof ABLY_KEY === 'string' && ABLY_KEY.length > 10 && ABLY_KEY.indexOf('<') < 0;
  }

  function loadAbly(cb) {
    if (window.Ably && window.Ably.Realtime) { cb(true); return; }
    var s = document.createElement('script');
    s.src = ABLY_SRC;
    s.integrity = ABLY_SRI;
    s.crossOrigin = 'anonymous';
    s.onload = function () { cb(!!(window.Ably && window.Ably.Realtime)); };
    s.onerror = function () { cb(false); };
    document.head.appendChild(s);
  }

  function netConnect(code, role, onReady, onFail) {
    if (!ablyConfigured()) {
      onFail('Онлайн-гру ще не налаштовано: потрібно вставити ключ Ably у файл (ABLY_KEY).');
      return;
    }
    loadAbly(function (ok) {
      if (!ok) { onFail('Не вдалося під’єднатися. Перевірте інтернет і спробуйте ще раз.'); return; }
      try {
        Net.client = new window.Ably.Realtime({
          key: ABLY_KEY,
          clientId: role + '-' + Math.floor(Math.random() * 1e9).toString(36),
          echoMessages: false
        });
        Net.role = role;
        Net.code = code;
        Net.wasConnected = false;
        Net.client.connection.on(onConnection);
        var ch = Net.client.channels.get(ROOM_PREFIX + code);
        Net.ch = ch;
        var sub = ch.subscribe(function (msg) { if (Net.ch === ch) onNet(msg.name, msg.data || {}); });
        // Коли канал під’єднано, беремо останній стан з історії (якщо вона ще зберігається).
        if (sub && typeof sub.then === 'function') sub.then(function () { loadHistory(ch); }, function () { setNetStatus('failed'); });
      } catch (e) {
        onFail('Не вдалося під’єднатися. Перевірте ключ Ably.');
        return;
      }
      onReady();
    });
  }

  function onConnection(change) {
    setNetStatus(change.current);
    if (change.current !== 'connected') return;
    // Після обриву зв’язку ще раз звіряємо партію.
    if (Net.wasConnected) send('hello', {});
    Net.wasConnected = true;
  }

  function loadHistory(ch) {
    try {
      var p = ch.history({ untilAttach: true, limit: 50 });
      if (!p || typeof p.then !== 'function') return;
      p.then(function (page) {
        var items = (page && page.items) || [];
        if (Net.ch !== ch) return;
        // items — від найновішого до найстарішого.
        for (var i = 0; i < items.length; i++) {
          if (items[i].name === 'state') { applyState(items[i].data || {}); return; }
        }
      }, function () { /* історії немає — чекаємо стан від суперника */ });
    } catch (e) { /* історія не обов’язкова */ }
  }

  function send(name, data) {
    if (!Net.ch) return;
    try {
      var p = Net.ch.publish(name, data);
      if (p && typeof p.then === 'function') p.then(null, function () { setNetStatus('failed'); });
    } catch (e) { setNetStatus('failed'); }
  }

  function netClose() {
    if (Net.helloTimer) window.clearInterval(Net.helloTimer);
    if (Net.client) {
      send('bye', {});
      var c = Net.client;
      later(function () { try { c.close(); } catch (e) { /* вже закрито */ } }, 300);
    }
    Net = { client: null, ch: null, role: '', code: '', helloTimer: null, wasConnected: false };
  }

  var NET_TEXT = {
    initialized: 'Під’єднуємось…', connecting: 'Під’єднуємось…', connected: 'На зв’язку',
    disconnected: 'Зв’язок перервано, повторюємо…', suspended: 'Немає зв’язку', closing: '', closed: '',
    failed: 'Помилка зв’язку'
  };
  var peerText = '';
  function setNetStatus(state) {
    if (current === 'join' && (state === 'failed' || state === 'suspended')) {
      // Учень ще чекає на гру: повертаємо можливість спробувати знову.
      netClose();
      joinCode = '';
      renderJoin();
      $('join-msg').textContent = 'Не вдалося під’єднатися. Перевірте інтернет і введіть код ще раз.';
      $('join-msg').classList.remove('hidden');
      return;
    }
    var t = NET_TEXT[state] || '';
    if (state === 'connected' && peerText) t = peerText;
    $('net-status').textContent = t;
  }
  function setPeer(text) {
    peerText = text;
    $('net-status').textContent = text;
  }

  /* ---------- Кімната: посилання й збереження ---------- */

  function newRoomId() {
    var id = '', buf = null, i;
    if (window.crypto && window.crypto.getRandomValues) {
      buf = new Uint32Array(ROOM_DIGITS);
      window.crypto.getRandomValues(buf);
    }
    for (i = 0; i < ROOM_DIGITS; i++) id += String(buf ? buf[i] % 10 : Math.floor(Math.random() * 10));
    return id;
  }

  function roomFromUrl() {
    var m = /[?&]room=(\d+)/.exec(window.location.search);
    return (m && m[1].length === ROOM_DIGITS) ? m[1] : '';
  }

  function pageUrl() {
    return window.location.href.split('#')[0].split('?')[0];
  }

  // Адреса сторінки з ?room=..., щоб після оновлення гравець повернувся в ту саму кімнату.
  function setUrlRoom(code) {
    try { window.history.replaceState(null, '', code ? '?room=' + code : pageUrl()); } catch (e) { /* не страшно */ }
  }

  function enterRoom(code) {
    $('room-code').textContent = code;
    $('link-input').value = pageUrl() + '?room=' + code;
    $('link-done').textContent = '';
    setUrlRoom(code);
  }

  function snapshot() {
    return {
      level: G.level, real: G.real, side: G.role === 'teacher' ? MC.other(G.me) : G.me,
      game: G.gameNo, moves: G.moves
    };
  }

  function sendState() {
    if (G.state && G.mode === 'online') send('state', snapshot());
  }

  // localStorage: id кімнати, роль цього пристрою й стан партії.
  function saveRoom() {
    if (!Net.code || !G.state || G.mode !== 'online') return;
    try {
      window.localStorage.setItem(ROOM_KEY, JSON.stringify({ room: Net.code, role: Net.role, state: snapshot() }));
    } catch (e) { /* сховище недоступне — стан прийде з Ably */ }
  }
  function loadRoom(code) {
    try {
      var d = JSON.parse(window.localStorage.getItem(ROOM_KEY) || 'null');
      return (d && d.room === code) ? d : null;
    } catch (e) { return null; }
  }
  function forgetRoom() {
    try { window.localStorage.removeItem(ROOM_KEY); } catch (e) { /* ігноруємо */ }
    if (roomFromUrl()) setUrlRoom('');
  }

  function copyLink() {
    var input = $('link-input');
    function done() { $('link-done').textContent = 'Скопійовано! Вставте посилання в чат учню.'; }
    function bySelect() {
      input.focus();
      input.select();
      try {
        if (document.execCommand('copy')) { done(); return; }
      } catch (e) { /* немає доступу до буфера */ }
      $('link-done').textContent = 'Виділіть посилання й скопіюйте його вручну.';
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).then(done, bySelect);
        return;
      }
    } catch (e) { /* спробуємо інакше */ }
    bySelect();
  }

  /* ---------- Вчитель ---------- */

  function createRoom() {
    var code = newRoomId();
    $('teacher-msg').classList.add('hidden');
    netConnect(code, 'teacher', function () {
      G.gameNo = 1;
      peerText = '';
      startGame(teacherPick.level, {
        mode: 'online', role: 'teacher', opponent: 'student', me: MC.other(teacherPick.side),
        real: teacherPick.level === LEVEL_COUNT && teacherPick.real
      });
      enterRoom(code);
      setPeer('Чекаємо учня…');
      saveRoom();
      sendState();
    }, function (msg) {
      $('teacher-msg').textContent = msg;
      $('teacher-msg').classList.remove('hidden');
    });
  }

  function teacherNewGame() {
    G.gameNo++;
    startGame(G.level, { mode: 'online', role: 'teacher', real: G.real, opponent: 'student', me: G.me });
    saveRoom();
    sendState();
  }

  /* ---------- Учень ---------- */

  var joinCode = '';
  function openJoin() {
    joinCode = '';
    renderJoin();
    $('join-msg').classList.add('hidden');
    show('join');
  }
  function renderJoin() {
    var t = '';
    for (var i = 0; i < ROOM_DIGITS; i++) t += i < joinCode.length ? joinCode.charAt(i) : '·';
    $('join-code').textContent = t;
  }
  function joinDigit(k) {
    if (joinCode.length >= ROOM_DIGITS || Net.client) return;
    joinCode += k;
    renderJoin();
    if (joinCode.length === ROOM_DIGITS) joinRoom(joinCode, null);
  }
  function joinDel() {
    if (Net.client) return;
    joinCode = joinCode.slice(0, -1);
    renderJoin();
  }

  // Увійти в кімнату: за посиланням, за кодом або після оновлення сторінки.
  // rec — збережений на цьому пристрої запис кімнати (або null).
  function joinRoom(code, rec) {
    var role = (rec && rec.role === 'teacher') ? 'teacher' : 'student';
    if (role === 'student') {
      $('join-msg').textContent = 'Під’єднуємось… Чекаємо вчителя.';
      $('join-msg').classList.remove('hidden');
    }
    netConnect(code, role, function () {
      enterRoom(code);
      if (rec && rec.state) applyState(rec.state);
      send('hello', {});
      if (role === 'student') {
        // Якщо вчитель ще не відкрив кімнату, повторюємо привітання, доки не прийде стан.
        Net.helloTimer = window.setInterval(function () { send('hello', {}); }, 3000);
      }
    }, function (msg) {
      if (current !== 'join') openJoin();
      $('join-msg').textContent = msg;
      $('join-msg').classList.remove('hidden');
      joinCode = '';
      renderJoin();
    });
  }

  function resumeFromUrl() {
    var code = roomFromUrl();
    if (!code) return;
    var rec = loadRoom(code);
    if (!(rec && rec.role === 'teacher')) {
      openJoin();
      joinCode = code;
      renderJoin();
    }
    joinRoom(code, rec);
  }

  /* ---------- Повідомлення ---------- */

  function onNet(name, d) {
    var peer = Net.role === 'teacher' ? 'Учень' : 'Вчитель';
    if (name === 'hello') {
      setPeer(Net.role === 'teacher' ? 'Учень у грі' : 'Вчитель на зв’язку');
      sendState();
    } else if (name === 'state') {
      if (Net.helloTimer) { window.clearInterval(Net.helloTimer); Net.helloTimer = null; }
      setPeer(Net.role === 'teacher' ? 'Учень у грі' : 'Вчитель на зв’язку');
      applyState(d);
    } else if (name === 'bye') {
      setPeer(peer + ' вийшов');
    }
  }

  function validState(d) {
    var lv = d && d.level;
    return typeof lv === 'number' && lv >= 1 && lv <= LEVEL_COUNT && Math.floor(lv) === lv &&
      (d.side === 'w' || d.side === 'b') && typeof d.game === 'number' && isMoveList(d.moves);
  }

  function isNewer(d) {
    if (!G.state || G.mode !== 'online') return true;
    if (d.game !== G.gameNo) return d.game > G.gameNo;
    return d.moves.length > G.moves.length;
  }

  function samePrefix(list, prefix) {
    for (var i = 0; i < prefix.length; i++) {
      if (list[i][0] !== prefix[i][0] || list[i][1] !== prefix[i][1]) return false;
    }
    return true;
  }

  // Прийняти стан з мережі, історії чи сховища, якщо він новіший за поточний.
  function applyState(d) {
    if (!validState(d) || !isNewer(d)) return;
    var online = G.state && G.mode === 'online';
    if (online && G.busy) {
      // Ще анімується попередній хід — приймемо стан трохи пізніше.
      gameLater(function () { applyState(d); }, 200);
      return;
    }
    if (online && d.game === G.gameNo && d.level === G.level && d.moves.length === G.moves.length + 1 &&
        samePrefix(d.moves, G.moves)) {
      // Суперник зробив один хід — показуємо його з анімацією.
      var last = d.moves[d.moves.length - 1];
      var m = MC.findMove(G.state, last[0], last[1]);
      if (m) { playMove(m, true); return; }
    }
    G.gameNo = d.game;
    var teacher = Net.role === 'teacher';
    var keepPeer = peerText;
    startGame(d.level, {
      mode: 'online', role: Net.role, real: !!d.real, moves: d.moves,
      opponent: teacher ? 'student' : 'teacher', me: teacher ? MC.other(d.side) : d.side
    });
    if (Net.code) $('room-code').textContent = Net.code;
    setPeer(keepPeer || (teacher ? 'Чекаємо учня…' : 'Вчитель на зв’язку'));
    saveRoom();
  }

  function isMoveList(list) {
    if (!list || typeof list.length !== 'number' || list.length > 400) return false;
    for (var i = 0; i < list.length; i++) {
      if (!list[i] || !isSq(list[i][0]) || !isSq(list[i][1])) return false;
    }
    return true;
  }
  function isSq(x) { return typeof x === 'number' && x >= 0 && x < 25 && Math.floor(x) === x; }

  /* ================== ПОДІЇ ================== */

  function renderTopButtons() {
    $('btn-lock').innerHTML = progress.all ? ICONS.unlock : ICONS.lock;
    $('btn-lock').classList.toggle('gold', progress.all);
  }

  function init() {
    $('btn-home').innerHTML = ICONS.home;
    $('btn-speak').innerHTML = ICONS.speak;
    $('btn-join').innerHTML = ICONS.people + 'Грати з вчителем';
    $('btn-restart').innerHTML = ICONS.retry + 'Почати знову';
    $('btn-bear').innerHTML = AVATARS.bear + 'Ведмедик<small>легко</small>';
    $('btn-fox').innerHTML = AVATARS.fox + 'Лисичка<small>хитро · медаль</small>';
    renderTopButtons();
    renderMap();

    $('btn-home').addEventListener('click', goHome);
    $('btn-lock').addEventListener('click', function () { openPin(); });
    $('pin-cancel').addEventListener('click', function () { hideOverlay('pin'); });
    buildPad($('pin-pad'), pinDigit, function () { pinValue = pinValue.slice(0, -1); renderPinDots(); });

    $('btn-speak').addEventListener('click', function () { speak($('hint-text').textContent); });
    if (window.speechSynthesis) {
      findVoice();
      if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged', findVoice);
    }

    var rb = $('rules-toggle').getElementsByTagName('button');
    for (var i = 0; i < rb.length; i++) {
      rb[i].addEventListener('click', function () {
        intro.real = this.getAttribute('data-real') === '1';
        renderIntro();
      });
    }
    var tb = $('teacher-rules').getElementsByTagName('button');
    for (i = 0; i < tb.length; i++) {
      tb[i].addEventListener('click', function () {
        teacherPick.real = this.getAttribute('data-real') === '1';
        renderTeacher();
      });
    }
    var sb = $('teacher-side').getElementsByTagName('button');
    for (i = 0; i < sb.length; i++) {
      sb[i].addEventListener('click', function () {
        teacherPick.side = this.getAttribute('data-side');
        renderTeacher();
      });
    }

    $('btn-bear').addEventListener('click', function () {
      startGame(intro.level, { mode: 'bot', real: intro.real, opponent: 'bear' });
    });
    $('btn-fox').addEventListener('click', function () {
      startGame(intro.level, { mode: 'bot', real: intro.real, opponent: 'fox' });
    });
    $('btn-restart').addEventListener('click', function () {
      if (G.mode === 'online') { if (G.role === 'teacher') teacherNewGame(); return; }
      startGame(G.level, { mode: 'bot', real: G.real, opponent: G.opponent });
    });

    $('btn-join').addEventListener('click', function () { openJoin(); });
    buildPad($('join-pad'), joinDigit, joinDel);

    $('btn-unlock-all').addEventListener('click', function () {
      progress.all = !progress.all;
      saveProgress();
      renderTopButtons();
      renderTeacher();
      renderMap();
    });
    $('btn-reset').addEventListener('click', function () {
      if (!window.confirm('Скинути всі зірочки й медалі на цьому пристрої?')) return;
      progress = blankProgress();
      saveProgress();
      renderTopButtons();
      renderTeacher();
      renderMap();
    });
    $('btn-create-room').addEventListener('click', createRoom);
    $('btn-copy').addEventListener('click', copyLink);

    $('moves-list').addEventListener('click', onMovesClick);
    $('mv-prev').addEventListener('click', function () { if (G.state) setView(shownPly() - 1); });
    $('mv-next').addEventListener('click', function () { if (G.state && G.view !== null) setView(G.view + 1); });
    $('mv-live').addEventListener('click', function () { setView(null); });
    $('btn-pgn').addEventListener('click', copyPgn);
    document.addEventListener('keydown', onMovesKey);

    // Сторінка закривається чи оновлюється: кімнату не забуваємо, щоб повернутися в партію.
    window.addEventListener('pagehide', netClose);
    resumeFromUrl();
  }

  init();
})();
</script>
</body>
</html>
